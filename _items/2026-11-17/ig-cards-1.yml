# 인스타그램 카드 뉴스 문안 — 2026-11-17 08:00 웹 발행, 08:00 게시. 카드 승인(11.16).
approved: true
# 게시 직후 첫 댓글: 두 입장 투표(2026-11-14 양식). 팔로우 문구는 도구가 자동으로 붙인다
poll:
  q: "성적이 비슷한데 진로 전망이 가정환경에 따라 다르다면?"
  options:
    - "학교가 먼저 기회를 보장해야 한다!!"
    - "진로 선택은 개인의 몫이다!!"
  ask: "1번과 2번 중 하나를 고르고, 이유를 한 줄로 댓글에 남겨 주세요!"
cards:
  - type: cover
    image: /assets/art/homer-snap-the-whip.jpg
    focus: 30% 55%
    credit: 「채찍 놀이」, 1872년 윈슬로 호머 · 메트로폴리탄미술관(CC0)
    hook: 성적은 비슷한데, 왜 내다보는 진로는 다를까?
    sub: 가정환경에 따라 학생이 예상하는 직업이 다르다는 분석이 나왔습니다. 롤스와 센으로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 10.67점
    big_note: 부모의 사회경제적 지위 상위 25%와 하위 25% 학생의 기대 직업지위 지수 차이(PISA 2022, 한국 학생)
    lines:
      - "11월 15일 보도로 알려진 **한국교육개발원** 보고서는 PISA에서 학생이 **30세 무렵 갖게 될 것으로 예상한 직업**을 분석했습니다. 상위 집단은 **이공계·보건의료 같은 전문직**을, 하위 집단은 **비전문직이나 '아직 못 정함'**을 고른 비율이 높았습니다."
      - "**읽기·수학·과학 성적이 비슷한 학생끼리** 비교해도 차이가 나타났습니다."
  - type: text
    label: 상담사는 배치되어 있어도
    big: 63.1% 대 40.8%
    big_note: 대학 교육과정을 인터넷으로 찾아본 학생(상위 25% 대 하위 25%, 2018년)
    lines:
      - "학교 밖 진로상담 **43.1% 대 27.4%**, 고등교육기관 방문 **43.8% 대 29.4%**였습니다."
      - "학교에 진로 담당자나 상담사가 배치되어 있는지는 **집안 형편에 따라 큰 차이가 없었습니다.** 그런데 **실제로 상담받은 경험**에는 차이가 있었습니다. 이 자료만으로 원인을 확정할 수는 없습니다."
  - type: text
    label: 왜 윤리 문제인가
    lines:
      - "예상하는 직업이 다르다는 것만으로 불평등이라고 할 수는 없습니다. **전문직이 아닌 길도 충분히 생각한 선택**일 수 있습니다."
      - "문제는 그 차이가 **충분히 알아보고 스스로 고른 데서** 나왔는지, **정보와 지원이 모자란 데서** 나왔는지입니다. 그렇다면 질문은 이렇게 됩니다. **선택의 기회는 공정한가?**"
  - type: quote
    label: 롤스 ① 같은 능력, 같은 전망
    who: 롤스
    text: 동일한 능력과 포부를 가진 사람들의 기대치가 그들이 처한 사회적 계급에 영향을 받아서는 안 된다.
    source: 롤스, 『정의론』(황경식 옮김, 이학사)
    note: "롤스는 법으로 문만 열어 두는 것으로는 모자라고, **공정한 기회**까지 주어져야 한다고 보았습니다. 이 조사로 원칙이 어겨졌다고 증명할 수는 없지만, 학생들이 **기회를 실제로 고르게 누리는지** 묻게 합니다."
  - type: quote
    label: 롤스 ② 의욕까지도 출발선이다
    who: 롤스
    text: 노력하고 힘쓰며 일반적인 의미에서 가치 있는 존재가 되고자 하는 의욕 그 자체까지도 행복한 가정 및 사회적 여건에 의존한다.
    source: 롤스, 『정의론』(황경식 옮김, 이학사)
    note: "롤스는 **기회 균등이 가족 제도가 있는 한 불완전할 수밖에 없다**는 것을 알았습니다. 즉, **의욕도 출발선의 일부**입니다."
  - type: quote
    label: 교과서에서는
    text: 운은 크게 나눠 타고난 천부적 자질이나 능력과 같은 자연적 운과 사회적 지위나 가정적 배경 같은 사회적 운으로 나뉜다. 롤스는 이러한 운을 중립화하여 최소 수혜자를 포함한 모두에게 이익이 되는 길을 모색하고자 하였다.
    source: 『인문학과 윤리』(길벗) 95쪽
    note: "어떤 집에서 태어나는지는 **사회적 운**입니다. 길벗 『인문학과 윤리』(99쪽)는 이 운을 다루는 롤스의 **정의의 두 원칙**도 함께 싣고 있습니다."
  - type: quote
    label: 롤스 ③ 교육의 몫
    who: 롤스
    text: 그에 못지않게 주요한 교육의 역할은 인간으로 하여금 자기 사회의 문화를 향유하도록 해주며 그 과업에 참여하게 함으로써 각자에게 자신의 가치에 대한 확고한 신념을 갖도록 해주는 것이다.
    source: 롤스, 『정의론』(황경식 옮김, 이학사)
    note: "롤스는 공정한 기회균등과 함께, 불평등이 **최소 수혜자에게 최대의 이익**이 되도록 제도를 짜야 한다고 보았습니다. 연구진이 제안한 **중3·고1 개별 진로상담(해마다 30분 이상)**은 불리한 학생의 **실질적인 기회를 넓히는 지원**으로 읽을 수 있습니다."
  - type: quote
    label: 센 ① 처지에 맞춰 조정되는 기대
    who: 센
    text: 이렇게 박탈당한 사람들은 순전히 생존하기 위해 어쩔 수 없이 자신의 빈곤한 상황에 순응하는 경향이 있다.
    source: 센, 『자유로서의 발전』(김원기 옮김, 갈라파고스)
    note: "센은 어려운 처지가 오래가면 사람은 **욕망과 기대를 조정한다**고 보았습니다. 그렇다고 학생의 선택을 의심하자는 것은 아닙니다. **선택은 존중하되**, 어떤 정보를 접했고 **어떤 길을 실제로 고를 수 있었는지**도 함께 살피자는 것입니다."
  - type: quote
    label: 센 ② 고를 수 있는 삶의 폭
    who: 센
    text: 따라서 역량은 일종의 자유로, 여러 가지 기능 조합을 성취할 실질적 자유를 말한다(덜 형식적으로 말하자면 다양한 삶의 양식을 추구할 자유다).
    source: 센, 『자유로서의 발전』(김원기 옮김, 갈라파고스)
    note: "역량은 재능이나 정보의 양을 말하지 않습니다. **가치 있게 여기는 삶을 실제로 고를 수 있는 자유**입니다. 부유한 사람의 단식과 가난한 사람의 굶주림은 결과가 같아도 **역량이 다릅니다.**"
  - type: compare
    label: 두 사람이 비추는 곳
    left:
      head: 롤스
      text: 학생들이 누리는 기회는 공정한가
      note: "의욕까지도 가정과 사회적 여건의 영향을 받는다 · 학교 제도는 계급의 장벽을 허물도록 짜여야 한다"
    arrow: ↓ 함께 보기
    right:
      head: 센
      text: 표현한 바람뿐 아니라, 실제로 고를 수 있는 삶의 범위까지
      note: 모든 학생이 전문직을 바라게 하는 것은 목표가 될 수 없다. 학생이 '자신이 영위하고 싶은 삶'을 알고 고를 수 있게 하는 것
  - type: pull
    who: 롤스
    text: 동일한 능력과 포부를 가진 사람들의 기대치가 그들이 처한 사회적 계급에 영향을 받아서는 안 된다.
    source: 롤스, 『정의론』
  - type: lesson
    label: 수업 연계
    subjects:
      - "『인문학과 윤리』 · 자유와 평등"
      - "『통합사회2』 · 사회 정의와 불평등"
      - "『윤리와 사상』 · 사회사상"
    cites:
      - "『인문학과 윤리』(길벗) 95쪽, 99쪽"
      - "『인문학과 윤리』(길벗) 96~97쪽(활동: 원초적 입장에서 원칙 만들기)"
    questions:
      - "학교의 진로상담 시간을 어떤 원칙으로 나누어야 공정할까?"
      - "학교가 먼저 보장해야 할 진로 탐색 기회는 무엇일까?"
  - type: end
