# 인스타그램 카드 뉴스 문안 — 재형 님 검토 반영(10.25): 쉬운 문장, 사실 범위 구분, 인용 출처는 번역서까지만. 승인 전까지 approved: false.
approved: false
cards:
  - type: cover
    image: /assets/art/gyges-ferrara.jpg
    focus: 50% 100%
    credit: 「기게스의 반지」, 16세기 페라라 화파 · 퍼블릭 도메인
    hook: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    sub: 건보공단 직원이 가입자 정보를 외부에 넘기고 돈을 받은 혐의로 파면되었습니다. 플라톤과 칸트로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    lines:
      - "**정보를 넘긴 직원**: 약 2년 6개월 동안 가입자 정보를 외부에 넘기고 돈을 받은 혐의로 7월에 파면되었습니다. 수사 중입니다."
      - "**무단 조회**: 업무와 상관없이 정보를 열어 보는 일이 되풀이되었고, 적발까지 길게는 **1,135일**이 걸린 조회도 있었습니다."
      - "**피해자 통지**: 석 달 넘게 피해자에게 알리지 못했다는 지적이 나왔습니다."
  - type: text
    label: 글라우콘의 도전 ① 기게스의 반지
    image: /assets/art/gyges-rijks.jpg
    focus: 50% 40%
    credit: 「청동 말에서 반지를 찾는 기게스」, 16세기 목판화 · 레이크스미술관(CC0)
    lines:
      - 목동 기게스는 땅속에서 **금반지**를 발견합니다.
      - 반지의 보석을 손 안쪽으로 돌리면 **몸이 남에게 보이지 않게 됩니다.** 그는 이 힘으로 왕을 죽이고 왕국을 차지합니다.
  - type: quote
    label: 글라우콘의 도전 ② 반지 두 개
    who: 글라우콘
    text: 만약에 이런 반지가 두 개 생겨서 하나는 올바른 사람이, 그리고 다른 하나는 올바르지 못한 사람이 끼게 된다면, 그런 경우에 올바름 속에 머무르면서 남의 것을 멀리하고 그것에 손을 대지 않을 정도로 그처럼 철석 같은 마음을 유지할 사람은 아무도 없을 것같이 생각됩니다. (…) 양쪽 다가 똑같은 방향으로 갈 겁니다.
    source: 플라톤, 『국가·정체』(박종현 역주, 서광사)
    note: 글라우콘의 물음은 이렇습니다. **벌을 피할 수 있다면, 그래도 정의로워야 할 이유가 있을까?** 무단 조회가 오래 드러나지 않을 수 있다는 점에서, 이 이야기는 이번 사건과 닿아 있습니다.
  - type: quote
    label: 소크라테스의 대답
    who: 소크라테스
    text: 우리는 '올바름'이 그 자체로 혼 자체를 위해서 최선의 것임을 알게 되었으며, 혼으로서는, 자기가 '기게스의 반지'를 가졌건 갖지 않았건 간에 (…) 올바른 것들을 행하여야만 한다는 것도 알게 되지 않았는가?
    source: 플라톤, 『국가·정체』(박종현 역주, 서광사)
    note: "'혼'은 영혼입니다. 소크라테스에게 정의는 남에게 보이는 모습이 아니라 **내 영혼을 건강하게 하는 일**이라서, 반지가 있어도 없어도 지켜야 합니다."
  - type: notes
    label: 교과서에서는 ① 기게스의 반지
    lines:
      - "\"플라톤은 인간의 영혼을 구성하는 각 부분이 그 기능을 잘 발휘하면 기게스의 반지를 끼고서도 정의로울 수 있다고 보았다.\" — 『윤리와 사상』"
      - "\"최근 증가하고 있는 사이버 폭력은 기게스의 반지를 떠오르게 한다. 누리꾼들이 기게스의 반지를 끼고 익명성 뒤에 숨어 거리낌 없이 악행을 저지르고 있는 모습이 연상된다.\" — 『현대사회와 윤리』"
  - type: quote
    label: 칸트 ① 바가지를 씌우지 않는 가게 주인
    who: 칸트
    text: 예컨대 가게 주인이 어리숙한 고객에게 바가지를 씌우지 않는 것은 물론 의무에 맞는 일이다. (…) 그러나 그렇다고 해서, 그 상인이 의무로부터, 그리고 정직의 원칙들에서 그렇게 처신한다고 믿기에는 아직 불충분하다. 그의 이익이 그것을 요구했을 수도 있는 것이다.
    source: 『윤리형이상학 정초』(백종현 옮김, 아카넷)
    note: 같은 행동도 이유가 다를 수 있습니다. **옳기 때문에** 하는 행동과, **장사가 안될까 봐** 하는 행동은 다릅니다. 처벌이 두려워서만 규칙을 지킨다면 앞의 경우가 아닙니다.
  - type: quote
    label: 칸트 ② 사람은 물건이 아니다
    who: 칸트
    text: 네가 너 자신의 인격에서나 다른 모든 사람의 인격에서 인간(성)을 항상 동시에 목적으로 대하고, 결코 한낱 수단으로 대하지 않도록, 그렇게 행위하라.
    source: 『윤리형이상학 정초』(백종현 옮김, 아카넷)
    note: 사람을 **내 목적을 이루는 도구로만** 쓰지 말라는 뜻입니다. 남의 진료 기록을 호기심으로 열어 보거나 돈을 받고 넘기는 일은 정보 속 당사자를 도구로만 대하는 일입니다.
  - type: notes
    label: 교과서에서는 ② 칸트
    lines:
      - "\"행위의 도덕성은 선의지에 근거하였는지의 여부, 다시 말해 행위의 동기에 따라 결정된다.\" — 『현대사회와 윤리』"
      - "\"좋은 결과를 가져온 행위일지라도 그것이 의무가 아닌 다른 의도, 즉 이익의 추구나 비난의 회피 등과 같은 의도에서 비롯하였다면 그 행위는 도덕적으로 옳지 않다고 보았다.\" — 『현대사회와 윤리』"
      - "\"상대방을 수단으로만 대해서는 안 되고 목적 그 자체로 대우해야 한다는 점에서 인간의 존엄성을 중시하고 있음을 알 수 있다.\" — 『윤리와 사상』"
  - type: end
    question: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    ask: 글라우콘과 소크라테스, 여러분은 누구 편인가요? 생각을 댓글로 남겨 주세요. 한 줄이어도 좋습니다.
