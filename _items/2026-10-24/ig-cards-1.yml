# 인스타그램 카드 뉴스 문안 — 새 디자인 시안 2(10.25). 10장으로 내용을 늘림. 재형 님 승인 전.
approved: false
cards:
  - type: cover
    image: /assets/art/gyges-ferrara.jpg
    focus: 50% 100%
    credit: 「기게스의 반지」, 16세기 페라라 화파 · 퍼블릭 도메인
    hook: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    sub: 건보공단 직원의 개인정보 조회와 유출
  - type: text
    label: 무슨 일이 있었나
    big: 2년 6개월
    big_note: 건보공단 직원 한 명이 가입자 정보를 외부에 넘긴 기간
    lines:
      - 10월 16일 국정감사에서, 이 직원이 정보를 넘기고 돈을 받다 7월에 **파면**된 사실이 다뤄졌습니다. 공단은 받은 돈이 "억대로 알고 있다"고 답했습니다.
      - 사건은 수사 중이고, 어떤 정보가 넘어갔는지 아직 정확히 모릅니다. 피해자는 **석 달 넘게** 유출 사실을 듣지 못했습니다.
  - type: notes
    label: 팔아넘긴 일만이 아니다
    lines:
      - 업무와 상관없이 가입자 정보를 들여다보는 **무단 조회**도 되풀이되고 있습니다. 2021년부터 올해 8월까지 피해자는 468명입니다.
      - 공단이 무단 조회를 알아채기까지 짧게는 하루, 길게는 **1,135일**이 걸렸습니다.
      - 2014년 국정감사에서는 직원 약 1만 2천 명 가운데 1만 명가량이 가입자 정보를 볼 수 있고, 한 직원이 헤어진 연인의 진료 내역을 **113번** 열어 본 일이 지적되었습니다.
      - 이사장은 업무 시간 중에 마음먹고 빼내는 경우는 잘 잡히지 않는다고 인정했습니다.
  - type: notes
    label: 왜 윤리 문제인가
    lines:
      - 건강보험공단에는 언제 어떤 병으로 병원에 갔는지까지 쌓입니다. 우리가 **맡길지 말지 고를 수 없는** 정보입니다.
      - 볼 수 있는 권한이 있으면 봐도 되는가? 권한은 **업무를 위해** 준 것이지 호기심을 채우라고 준 것이 아닙니다.
      - 피해자는 언제 알아야 하는가? 「개인정보 보호법」 시행령은 유출을 안 때부터 **72시간 안에** 알리라고 정합니다. 내 정보가 어디로 갔는지 아는 것도 권리입니다.
  - type: text
    label: 기게스의 반지
    image: /assets/art/gyges-rijks.jpg
    focus: 50% 40%
    credit: 「청동 말에서 반지를 찾는 기게스」, 16세기 목판화 · 레이크스미술관(CC0)
    lines:
      - 플라톤의 『국가』 2권에서 글라우콘이 꺼내는 이야기입니다. 목동 기게스는 끼면 **몸이 보이지 않는 반지**를 얻고, 그 힘으로 왕을 죽인 뒤 나라를 차지합니다.
      - 글라우콘은 사람이 정의롭게 사는 것은 정의가 좋아서가 아니라 **들켜서 처벌받을까 두려워서**라고 말합니다.
  - type: quote
    label: 플라톤이 남긴 물음
    who: 플라톤
    text: 만약에 이런 반지가 두 개 생겨서 하나는 올바른 사람이, 그리고 다른 하나는 올바르지 못한 사람이 끼게 된다면 (…) 양쪽 다가 똑같은 방향으로 갈 겁니다.
    source: 『국가·정체』(박종현 역주, 서광사) 2권 360b~c
    note: 업무 시간 중의 조회가 잘 드러나지 않는다면, 공단 직원은 **이 반지를 낀 것과 같은 처지**에 놓입니다.
  - type: quote
    label: 칸트의 대답
    who: 칸트
    text: 이성적 존재자들은 모두 자기 자신과 다른 모든 이를 결코 한낱 수단이 아니라, 항상 동시에 목적 그 자체로서 대해야 한다는 법칙 아래에 서 있다.
    source: 『윤리형이상학 정초』 · 「인문학과 윤리」(길벗) 80쪽 수록
    note: 남의 진료 기록을 몰래 열어 보는 일은 정보의 주인을 내 호기심과 이익의 도구로 삼는 일입니다. 칸트에게 이 일은 **들키느냐와 상관없이** 그릇됩니다.
  - type: compare
    label: 개인정보를 지키는 두 가지 방법
    left: {head: 들키지 않게 막는다, text: 감시와 처벌로 부정을 억누른다, note: "글라우콘 · 조회 기록 상시 탐지, 즉시 파면"}
    right: {head: 들키지 않아도 하지 않는다, text: 정보의 주인을 목적으로 대한다, note: "칸트 · 권한을 업무 목적에만 쓰는 직업윤리"}
  - type: flow
    label: 수업에서는 이렇게
    steps:
      - [사례 읽기, "돈을 받고 넘긴 일, 무단 조회, 미뤄진 통지를 나눠 정리한다"]
      - [사상가로 읽기, "플라톤: 아무도 모르면 보지 않을 수 있는가 / 칸트: 왜 그 자체로 그릇된가"]
      - [제도 설계하기, "공단 이사장이 되어 바꿀 제도와 그래도 남는 한계를 적는다"]
      - [모둠 토론하기, "가) 촘촘한 감시와 엄한 처벌 나) 정보를 다루는 사람의 직업윤리"]
  - type: end
    question: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    ask: 들키지 않아도 하지 않을 수 있을까요? 여러분의 생각을 댓글로 남겨 주세요. 한 줄이어도 좋습니다.
