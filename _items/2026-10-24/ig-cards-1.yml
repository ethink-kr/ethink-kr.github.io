# 인스타그램 카드 뉴스 문안 — 시안 3(10.25). 시사는 재료, 사상가의 이야기와 원문이 중심. 10장(사건 카드는 표지·반지 카드에 합치고 수업 흐름 카드는 뺌). 재형 님 승인 전.
approved: false
cards:
  - type: cover
    image: /assets/art/gyges-ferrara.jpg
    focus: 50% 100%
    credit: 「기게스의 반지」, 16세기 페라라 화파 · 퍼블릭 도메인
    hook: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    sub: 건보공단 직원이 2년 반 동안 가입자 정보를 넘기다 파면되었습니다. 플라톤과 칸트로 읽습니다.
  - type: quote
    label: 글라우콘의 도전 ① 정의는 약속일 뿐이다
    who: 플라톤
    text: 사람들이 서로들 올바르지 못한 짓을 저지르기도 하고 또 당하기도 하며, 그 양쪽 다를 겪어 보게 되었을 때 (…) 서로간에 올바르지 못한 짓을 저지르거나 당하지 않도록 약정을 하는 것이 이익이 되겠다는 생각을 하게 된다고 말씀입니다. 또한 바로 이것이 연유가 되어, 사람들은 자신들의 법률과 약정을 제정하기 시작했으며
    source: 『국가·정체』(박종현 역주, 서광사) 2권 358e~359a
    note: 『국가』 2권에서 플라톤의 형 글라우콘은 소크라테스에게 묻습니다. 사람들이 정의를 지키는 것은 **당하기 싫어서 맺은 약속** 때문이 아닌가?
  - type: text
    label: 글라우콘의 도전 ② 기게스의 반지
    image: /assets/art/gyges-rijks.jpg
    focus: 50% 40%
    credit: 「청동 말에서 반지를 찾는 기게스」, 16세기 목판화 · 레이크스미술관(CC0)
    lines:
      - 목동 기게스는 지진으로 갈라진 땅속 청동 말 안에서 송장의 손가락에 낀 **금반지**를 빼 옵니다.
      - 모임에서 반지의 "보석받이(거미발)를 자신을 향해 손 안쪽으로 돌렸는데", 그러자 **아무도 그를 보지 못했습니다.** 그는 이 힘으로 왕을 죽이고 왕국을 차지합니다.
  - type: quote
    label: 글라우콘의 도전 ③ 반지 두 개
    who: 플라톤
    text: 만약에 이런 반지가 두 개 생겨서 하나는 올바른 사람이, 그리고 다른 하나는 올바르지 못한 사람이 끼게 된다면, 그런 경우에 올바름 속에 머무르면서 남의 것을 멀리하고 그것에 손을 대지 않을 정도로 그처럼 철석 같은 마음을 유지할 사람은 아무도 없을 것같이 생각됩니다. (…) 양쪽 다가 똑같은 방향으로 갈 겁니다.
    source: 『국가·정체』(박종현 역주, 서광사) 2권 360b~c
    note: 공단이 직원의 무단 조회를 알아채기까지 길게는 **1,135일**이 걸렸습니다. 업무 시간 중의 조회가 잘 드러나지 않는다면, 공단 직원은 **이 반지를 낀 것과 같은 처지**입니다.
  - type: quote
    label: 소크라테스의 대답
    who: 플라톤
    text: 우리는 '올바름'이 그 자체로 혼 자체를 위해서 최선의 것임을 알게 되었으며, 혼으로서는, 자기가 '기게스의 반지'를 가졌건 갖지 않았건 간에 (…) 올바른 것들을 행하여야만 한다는 것도 알게 되지 않았는가?
    source: 『국가·정체』(박종현 역주, 서광사) 10권 612b
    note: 『국가』의 긴 논의 끝에 소크라테스는 반지 이야기로 돌아옵니다. 정의는 들키지 않으려는 약속이 아니라 **내 영혼을 위한 최선**이라는 대답입니다.
  - type: quote
    label: 칸트 ① 바가지를 씌우지 않는 가게 주인
    who: 칸트
    text: 예컨대 가게 주인이 어리숙한 고객에게 바가지를 씌우지 않는 것은 물론 의무에 맞는 일이다. (…) 그러나 그렇다고 해서, 그 상인이 의무로부터, 그리고 정직의 원칙들에서 그렇게 처신한다고 믿기에는 아직 불충분하다. 그의 이익이 그것을 요구했을 수도 있는 것이다.
    source: 『윤리형이상학 정초』(백종현 옮김, 아카넷) B9
    note: 칸트는 **의무에 맞는 행위**와 **의무로부터 나온 행위**를 나눕니다. 감시가 무서워 조회하지 않는 직원은 앞의 경우입니다.
  - type: quote
    label: 칸트 ② 사람은 물건이 아니다
    who: 칸트
    text: 네가 너 자신의 인격에서나 다른 모든 사람의 인격에서 인간(성)을 항상 동시에 목적으로 대하고, 결코 한낱 수단으로 대하지 않도록, 그렇게 행위하라.
    source: 『윤리형이상학 정초』(백종현 옮김, 아카넷) B66~67
    note: 남의 진료 기록을 몰래 열어 보는 일은 정보의 주인을 내 호기심과 이익의 **도구**로 삼는 일입니다. 칸트에게 이 일은 들키느냐와 상관없이 그릇됩니다.
  - type: quote
    label: 교과서에서는 ① 『인문학과 윤리』
    who: 칸트
    text: 목적들의 나라에서 모든 것은 값을 갖거나 존엄성을 갖는다. 값을 가진 것은 같은 값을 갖는 다른 것으로 대체될 수 있다. 이에 반해, 모든 값을 넘어서는, 그래서 같은 값을 갖는 것을 용납하지 않는 것은 존엄성을 갖는다.
    source: 『윤리형이상학 정초』 · 『인문학과 윤리』(길벗) 80쪽 수록
    note: 길벗 『인문학과 윤리』는 Ⅲ단원 「우리는 자유롭고 평등한 존재일까?」에서 『장자』와 함께 『윤리형이상학 정초』를 읽습니다.
  - type: notes
    label: 교과서에서는 ② 이렇게 풀이합니다
    lines:
      - "\"나 또는 다른 사람을 어떠한 목적을 이루기 위한 도구로 사용하고 있는지 반성하고, 인간의 존엄성을 추구해야 할 궁극적 목적이자 가치로 삼아야 한다는 것이다.\""
      - "\"존엄성은 값을 매길 수 없는 것이며, 이용 가치로 평가될 수 없는 절대적인 가치이다.\""
      - "교과서의 물음: \"우리는 왜 모든 사람이 평등하다고 말하는가?\" — 『인문학과 윤리』(길벗) 80~81쪽"
  - type: end
    question: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    ask: 글라우콘과 소크라테스, 여러분은 누구 편인가요? 생각을 댓글로 남겨 주세요. 한 줄이어도 좋습니다.
