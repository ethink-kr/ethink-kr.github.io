# 인스타그램 카드 뉴스 문안 — 새 디자인 시안(10.25). 10.24에 올린 7장 게시물을 바꿀지는 재형 님이 정한다.
approved: false
cards:
  - type: cover
    image: /assets/art/gyges-ferrara.jpg
    focus: 50% 100%
    credit: 「기게스의 반지」, 16세기 페라라 화파 · 퍼블릭 도메인
    hook: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    sub: 건보공단 직원의 개인정보 조회와 유출
  - type: text
    label: 무슨 일이 있었나
    big: 1,135일
    big_note: 건보공단이 직원의 무단 조회를 알아채기까지 걸린 가장 긴 기간
    lines:
      - 직원 한 명이 2년 반 동안 가입자 정보를 외부에 넘기고 돈을 받다 파면되었습니다.
      - 피해자는 석 달이 넘도록 유출 사실을 알지 못했습니다.
  - type: notes
    label: 왜 윤리 문제인가
    lines:
      - 건강보험 정보는 우리가 맡길지 말지 고를 수 없는 정보입니다.
      - 볼 수 있는 권한이 있으면 봐도 되는가? 권한은 업무를 위해 준 것입니다.
      - 피해자는 언제 알아야 하는가? 법은 72시간 안에 알리라고 정합니다.
  - type: quote
    label: 기게스의 반지
    who: 플라톤
    text: 만약에 이런 반지가 두 개 생겨서 하나는 올바른 사람이, 그리고 다른 하나는 올바르지 못한 사람이 끼게 된다면 (…) 양쪽 다가 똑같은 방향으로 갈 겁니다.
    source: 『국가·정체』(박종현 역주, 서광사) 2권 360b~c
  - type: compare
    label: 개인정보를 지키는 두 가지 방법
    left: {head: 들키지 않게 막는다, text: 감시와 처벌로 부정을 억누른다, note: "글라우콘 · 조회 기록 상시 탐지, 즉시 파면"}
    right: {head: 들키지 않아도 하지 않는다, text: 정보의 주인을 목적으로 대한다, note: "칸트 · 권한을 업무 목적에만 쓰는 직업윤리"}
  - type: flow
    label: 수업 흐름
    steps:
      - [사례 읽기, "돈을 받고 넘긴 일, 무단 조회, 미뤄진 통지를 나눠 정리한다"]
      - [사상가로 읽기, "플라톤: 아무도 모르면 보지 않을 수 있는가 / 칸트: 왜 그 자체로 그릇된가"]
      - [제도 설계하기, "공단 이사장이 되어 바꿀 제도와 남는 한계를 적는다"]
      - [모둠 토론하기, "감시와 처벌인가, 직업윤리인가"]
  - type: end
    question: 아무도 모르게 볼 수 있다면, 그래도 보지 말아야 할까?
    ask: 들키지 않아도 하지 않을 수 있을까요? 여러분의 생각을 댓글로 남겨 주세요. 한 줄이어도 좋습니다.
