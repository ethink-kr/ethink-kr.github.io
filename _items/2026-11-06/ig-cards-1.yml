# 인스타그램 카드 뉴스 문안 — 2026-11-06 발행 예정(웹). 초안.
approved: false
cards:
  - type: cover
    image: /assets/art/zhou-dongqing-fishes.jpg
    focus: 45% 50%
    credit: 「물고기의 즐거움」, 1291년 저우둥칭 · 메트로폴리탄미술관(CC0)
    hook: 삶의 마지막 치료, 멈출 때는 누가 정할까?
    sub: 11월 7~8일 시민 300명이 연명의료를 숙의합니다. 하버마스와 장자로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 55.2%
    big_note: 연명의료 유보·중단 이행 53만 8,749건 가운데 가족의 진술·합의에 근거한 비율(2026년 8월 말 누적)
    lines:
      - "환자가 직접 쓴 문서(연명의료계획서·사전연명의료의향서)에 근거한 경우는 **44.8%**입니다."
      - "연명의료를 멈춰도 **통증 완화, 영양분·물·산소 공급은 계속합니다.** 돌봄을 멈추는 것이 아닙니다."
      - "11월 7~8일, 인구 비율에 맞춰 뽑은 **시민 300여 명**이 숙의 토론을 합니다. 쟁점은 **멈출 수 있는 시점**, **대신 정할 사람**, 삶의 마지막 의료와 돌봄입니다."
  - type: quote
    label: 하버마스 ① 누가 담론에 들어오나
    who: 하버마스
    text: 말할 수 있고 행위 능력이 있는 사람들은 모두 자유롭게 담론에 참여할 자격이 있다. (…) 또한 다른 사람의 주장에 의문을 제기하고 비판할 수 있다. 그리고 이와 같은 권리들을 행사할 때 내부나 외부의 강요 때문에 방해받지 않는다.
    source: 하버마스, 『담론 윤리의 해명』 · 『현대사회와 윤리』 교과서
    note: "옳은 규범은 한 사람이 혼자 정할 수 없습니다. **영향을 받는 사람들이 함께 따지고 합의**해야 합니다."
  - type: quote
    label: 하버마스 ② 토론처럼 보여도 토론이 아닐 때
    who: 하버마스
    text: 특정한 참여자들이 허용되지 않고, 특정한 주제들과 기여들이 억압되고, 협박을 통해 예/아니요의 입장 표명이 강요되면, 추정된 논증이 진정한 논증이 아니라는 사실을 모든 화자는 직관적으로 안다.
    source: 하버마스, 『담론 윤리의 해명』 · 『현대사회와 윤리』 교과서
    note: "인구 비율에 맞춘 선발은 **다양한 관점을 담으려는 장치**입니다. 자료가 균형 잡혔는지, 시민이 **전문가의 설명에 질문하고 따질 수 있는지**도 봐야 합니다."
  - type: quote
    label: 교과서에서는 올바른 대화의 기준
    text: 첫째, 서로의 말이 무슨 뜻인지 이해할 수 있다. 둘째, 그 내용은 참이어야 한다. 셋째, 상대방이 대화의 기준을 성실히 지키리라 믿을 수 있어야 한다. 넷째, 대화하는 사람들 사이의 관계가 평등하고 수평적이어야 한다.
    source: 『인문학과 윤리』(길벗) 119쪽
    note: "이 기준이 지켜질 때 **대립하는 의견이 공론장에 나오고**, 참여한 사람들이 **합의 결과를 받아들일 수 있다**고 교과서는 풀이합니다."
  - type: notes
    label: 하버마스 ③ 토론장의 빈자리
    lines:
      - "이 규칙의 영향을 가장 크게 받는 사람, **자신의 의사를 표현할 수 없는 임종기 환자**는 토론장에 올 수 없습니다."
      - "그래서 참가자는 **'이상적 역할 수용'**, 곧 관련된 모든 사람의 자리에 서서 생각해 보아야 합니다. 누구나 언젠가 뜻을 밝히기 어려워질 수 있습니다."
      - "다만 시민 토론은 **제도**를 만들고, 병실에서는 **한 환자의 뜻**을 확인합니다. 다수의 합의가 그 뜻을 대신할 수는 없습니다. 가족회의에서도 묻습니다. **누구나 말할 수 있었는가.**"
  - type: quote
    label: 장자 ① 아내가 죽었는데 노래라니
    who: 혜자
    text: 자네는 아내와 살면서 아이들을 기르고 이제 늙은 처지일세. 아내가 죽었는데 곡을 하지 않는 것도 너무한 일인데, 거기다 질그릇을 두드리며 노래까지 하다니 너무 심하지 않은가?
    source: 장자, 『장자』(오강남 풀이, 현암사)
    note: "『장자』에 실린 이야기입니다. 장자의 아내가 죽어 친구 혜자가 문상을 갔더니, 장자가 **다리를 뻗고 앉아 질그릇을 두드리며 노래**하고 있었습니다."
  - type: quote
    label: 장자 ② 사철의 흐름처럼
    who: 장자
    text: 아내가 죽었을 때 나라고 어찌 슬퍼하는 마음이 없었겠나? (…) 그것이 변하여 기가 되고, 기가 변하여 형체가 되었고, 형체가 변하여 삶이 되었지. 이제 다시 변해 죽음이 된 것인데, 이것은 마치 봄 여름 가을 겨울 사철의 흐름과 맞먹는 일.
    source: 장자, 『장자』(오강남 풀이, 현암사)
    note: "장자도 **먼저 슬퍼했습니다.** 그다음에 죽음을 계절이 바뀌는 일로 받아들였습니다. 오늘에 비추어 읽으면, 죽음을 받아들이는 일이 곧 **사랑을 버리는 일은 아니라는** 생각을 해 볼 수 있습니다."
  - type: quote
    label: 교과서에서는 참된 사람
    who: 장자
    text: 옛날 참된 사람은 삶을 기뻐할 줄 모르며 죽음을 싫어할 줄도 몰라서, 태어날 때 기뻐하지 않고 죽음을 거부하지 않아서 홀연히 떠나고 홀연히 태어날 뿐이다. (…) 이것을 일컬어 욕심으로 도를 해치지 아니하고, 인위로 자연을 조장하지 않는다고 하니 이런 사람을 일러 참된 사람이라 한다.
    source: 『인문학과 윤리』(길벗) 86쪽
    note: "이 이야기는 의료 결정의 규칙을 주지 않습니다. 결정은 **환자의 뜻, 치료의 효과, 법적 절차**를 함께 살펴 내립니다. 장자는 **죽음을 대하는 마음**을 돌아보게 합니다."
  - type: quote
    label: 장자 ③ 물고기의 즐거움
    who: 장자
    text: 혜자가 말했습니다. "자네는 물고기가 아닌데, 어찌 물고기의 즐거움을 알 수 있나?" 장자가 말했습니다. "자네는 내가 아닌데, 어떻게 내가 물고기의 즐거움을 모른다는 것을 알 수 있는가?"
    source: 장자, 『장자』(오강남 풀이, 현암사)
    note: "남의 마음을 안다고 말할 때 근거는 무엇일까요? 환자의 뜻을 전하는 가족도 물어야 합니다. **\"내가 바라는 결정인가, 환자가 실제로 밝혔던 뜻인가?\"**"
  - type: end
