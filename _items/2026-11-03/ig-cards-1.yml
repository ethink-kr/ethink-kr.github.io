# 인스타그램 카드 뉴스 문안 — 2026-11-03 초안. 재형 님 승인 전.
approved: false
cards:
  - type: cover
    image: /assets/art/cuyp-young-herdsmen.jpg
    focus: 70% 70%
    credit: 「소와 함께 있는 젊은 목동들」, 1655~1660년경 알베르트 카위프 · 메트로폴리탄미술관(CC0)
    hook: 줄이는 몫은 누가 더 져야 할까?
    sub: 유엔환경계획은 지금대로 가면 2.8도까지 오를 수 있다고 전망했습니다. 하딘과 싱어로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 2.8도
    big_note: 지금 정책을 이어 갈 때 이번 세기 안에 이를 수 있는 기온 상승(유엔환경계획, 10.21)
    lines:
      - "각국 약속을 모두 지키면 **2.6도**, 탄소 중립 목표까지 지키면 **2.1도**입니다."
      - "1.5도로 돌아오려면 2025년보다 2035년까지 **45%**를 줄여야 하는데, 지금 약속으로는 **11~15%**에 그칩니다."
      - "11월 9일부터 튀르키예 안탈리아에서 COP31이 열립니다."
  - type: quote
    label: 하딘 ① 모두에게 열린 목초지
    who: 하딘
    text: 모두에게 열린 목초지를 떠올려 보라.
    source: 하딘, 「공유지의 비극」(『사이언스』, 1968) 원문을 옮김
    note: "소를 한 마리 더 풀면 **이익은 내가 다 갖고**, 풀이 줄어드는 **손해는 모두가 나눠 집니다.** 목동마다 이렇게 계산해 소를 늘립니다."
  - type: quote
    label: 하딘 ② 공유지의 비극
    who: 하딘
    text: 바로 거기에 비극이 있다. 사람들은 저마다 한없이 가축을 늘리도록 몰아붙이는 체계에 갇혀 있다. 한정된 세계에서 말이다. (…) 공유지에서의 자유는 모두에게 파멸을 가져온다.
    source: 하딘, 「공유지의 비극」(『사이언스』, 1968) 원문을 옮김
    note: "대기도 목초지입니다. 더 배출하는 **이익은 그 나라가**, 기온이 오르는 **손해는 온 세계가** 집니다. 그래서 나라마다 \"우리만 줄이면 손해\"라고 계산합니다."
  - type: notes
    label: 하딘 ③ 서로 합의한 상호 강제
    lines:
      - "하딘은 양심에 호소하는 것만으로는 부족하다고 보았습니다. 양심을 지킨 사람만 손해를 봅니다."
      - "그가 내놓은 답은 **\"서로 합의한 상호 강제\"**입니다. 모두가 동의한 규칙으로 모두를 함께 묶자는 것입니다."
      - "그런데 파리 협정은 나라마다 **스스로 목표를 내는 방식**이고, 지키지 못해도 벌이 없습니다. 보고서의 '격차'는 여기서 생깁니다."
  - type: quote
    label: 싱어 ① 대기라는 수채통
    who: 싱어
    text: 모든 사람이 쓰레기를 하나의 거대한 수채통에 버리는 마을에 우리가 산다고 상상해 보자. 쓰레기가 수채통에 들어간 다음에 어떻게 되는지는 아무도 모르지만, 쓰레기는 사라지고 그 누구에게도 악영향을 미치지 않으므로, 어느 누구도 그것을 우려하지 않는다.
    source: 싱어, 『세계화의 윤리』(김희정 옮김, 아카넷)
    note: "그런데 수채통이 넘치기 시작합니다. 싱어는 대기를 **'전 지구적 수채통'**이라 부르고, 이제 남은 몫을 **어떻게 나눌지** 묻습니다."
  - type: quote
    label: 싱어 ② 망가뜨린 사람이 고친다
    who: 싱어
    text: 동일한 욕조를 사용하는 20명의 사람들이 사는 마을에서, 한 사람은 하수구 구멍을 막아버리게 될 머리카락을 30퍼센트 흘려 보냈고, 3명은 사실 전혀 머리카락을 흘려 보내지 않았다.
    source: 싱어, 『세계화의 윤리』(김희정 옮김, 아카넷)
    note: "고치는 비용은 **막은 머리카락의 양**대로 나누자는 기준입니다. 30%는 싱어가 든 옛 자료(1950~1986년 미국의 누적 배출)에서 왔습니다."
  - type: quote
    label: 싱어 ③ 모든 사람에게 같은 몫
    who: 싱어
    text: 다시 말해, 모든 사람은 대기라는 수채통의 일부에 대해 다른 사람과 똑같은 권리를 가진다.
    source: 싱어, 『세계화의 윤리』(김희정 옮김, 아카넷)
    note: "나라가 아니라 **사람 수대로** 나누는 기준입니다. 싱어는 이것이 과거를 묻지 않으니 오히려 **부유한 나라에 너그러운 기준**이라고 덧붙입니다. 셋째 기준은 **가난한 나라를 더 가난하게 만들지 않는 것**(롤스)입니다."
  - type: quote
    label: 교과서에서는 기후 정의
    text: 선진국이 지난날 온실가스를 배출하며 편의와 혜택을 누렸다면, 오늘날 기후위기로 인한 피해는 경제 개발에서 뒤처진 나라들이 입고 있기 때문이다. 또 온실가스를 줄이기 위해 저개발 국가의 발전을 선진국과 똑같이 제한하는 것이 공평한지를 두고도 논란이 되었다.
    source: 『윤리문제 탐구』(길벗) 157쪽
    note: "교과서는 기후 정의를 **\"기후변화에 따른 불평등을 해소함으로써 실현되는 정의\"**라고 풀이합니다. 같은 쪽에서 미래 세대에 대한 요나스의 책임 윤리도 다룹니다."
  - type: end
