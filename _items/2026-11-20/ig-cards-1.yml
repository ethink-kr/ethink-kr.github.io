# 인스타그램 카드 뉴스 문안 — 2026-11-20 발행 예정 글(초안). 재형 님 승인 전.
approved: false
# 게시 직후 첫 댓글: 두 입장 투표(2026-11-14 양식). 팔로우 문구는 도구가 자동으로 붙인다
poll:
  q: "동물 학대범의 사육을 금지하는 법, 누구를 위한 것일까?"
  options:
    - "동물의 고통을 줄이기 위해서다!!"
    - "사람의 도덕성을 지키기 위해서다!!"
  ask: "1번과 2번 중 하나를 고르고, 이유를 한 줄로 댓글에 남겨 주세요!"
cards:
  - type: cover
    image: /assets/art/landseer-humane-society.jpg
    focus: 30% 40%
    credit: 「인도주의 협회의 뛰어난 회원」, 1838년 에드윈 랜시어 · 퍼블릭 도메인
    hook: 동물을 학대한 사람, 다시 동물을 길러도 될까?
    sub: 동물 학대자에게 최대 5년 동안 동물을 기르지 못하게 하는 법이 생겼습니다. 무엇으로 정당화할까요? 벤담과 칸트로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 1~5년
    big_note: 법이 정한 동물학대범죄로 기소된 사람에게 재범 위험이 있으면, 검사의 청구로 법원이 학대 사건 판결과 함께 선고할 수 있는 사육금지 기간
    lines:
      - "동물보호법 개정안이 **10월 1일 국회를 통과**해 **10월 27일 공포**되었습니다. 사육금지명령은 **2027년 10월 28일**부터 시행됩니다."
      - "명령은 원칙적으로 **판결 확정일부터** 집행되고, 그 기간 동안 **동물을 기르거나 관리·보호하지 못합니다.** 보호관찰을 받고, 어기면 **1년 이하 징역 또는 1천만 원 이하 벌금**입니다."
  - type: text
    label: 함께 바뀐 것
    big: 100만 원
    big_note: 최소한의 사육·관리 의무를 어겼을 때 과태료 한도
    lines:
      - "반려동물에게 **최소한의 사육 공간과 먹이, 적정한 길이의 목줄** 같은 의무를 지키지 않으면, 동물이 **다치거나 병들지 않았어도** 물릴 수 있습니다."
      - "지자체가 보호 중인 피해 동물의 소유자가 학대로 기소되면 **판결 확정 전까지 계속 보호**할 수 있습니다. 지자체가 소유권을 가져온 동물은 학대 전력자에게 **기증·분양이 제한**됩니다."
  - type: text
    label: 왜 윤리 문제인가
    lines:
      - "우리 민법은 동물을 **물건(재산)**으로 봅니다. 즉, 소유권의 대상입니다. 하지만 동물은 **살아 있고, 고통을 느낍니다.**"
      - "동물을 보호하기 위해 **사람의 소유와 사육을 어디까지 제한할 수 있을까요?** 그 근거는 **동물의 고통일까, 사람의 도덕성일까?** 근거에 따라 법이 어디까지 가야 하는지도 달라집니다."
  - type: quote
    label: 벤담 ① 사물로 격하된 동물
    who: 벤담
    text: (1) 사람이라고 부를 수 있는 다른 인간들. (2) 다른 동물들. 고대 법학자들의 무신경함으로 인하여 동물들의 이익은 무시되어왔고 그것들은 사물의 부류로 격하되었다.
    source: 벤담, 『도덕과 입법의 원칙에 대한 서론』(강준호 옮김, 아카넷)
    note: "벤담은 **법이 행복을 돌봐야 할 존재**로 사람과 함께 동물을 꼽았습니다. 동물을 물건으로 보는 오늘의 민법과 겹치는 비판입니다."
  - type: quote
    label: 벤담 ② 괴롭힐 이유가 있는가
    who: 벤담
    text: 그러나 우리가 동물을 괴롭혀야 할 이유가 있는가? 나는 아무런 이유를 찾을 수 없다. 우리가 동물을 괴롭히지 말아야 할 이유가 있는가? 그렇다, 여러 가지가 있다.
    source: 벤담, 『도덕과 입법의 원칙에 대한 서론』(강준호 옮김, 아카넷)
    note: "벤담은 동물이 앞날의 불행을 오래 내다보지 않고, 사람이 주는 죽음이 더 빠르고 덜 고통스럽다고 보아 **먹는 일과 괴롭히는 일을 나눴습니다.** 그가 문제 삼은 것은 **고통**입니다. 다치지 않았어도 과태료를 물리는 조항과 맞닿습니다."
  - type: quote
    label: 벤담 ③ 고통을 느낄 수 있는가
    who: 벤담
    text: 문제는 그것들이 이성적으로 사고할 수 있는가도 아니고 그것들이 말을 할 수 있는가도 아니라, 그것들이 고통을 느낄 수 있는가이다.
    source: 벤담, 『도덕과 입법의 원칙에 대한 서론』(강준호 옮김, 아카넷)
    note: "바로 앞에서 벤담은 **노예제**를 꺼냅니다. 피부색이 괴롭혀도 될 이유가 아니듯, **다리의 수나 털**도 이유가 될 수 없다는 것입니다."
  - type: quote
    label: 칸트 ① 간접적 의무
    who: 칸트
    text: 우리는 동물과 관련해서 직접적 의무를 지지 않는다. 동물은 자의식적이지 못하므로, 어떤 목적을 위한 수단일 뿐이다. 그 목적이란 인간이다. (…) 동물에 대한 우리의 의무는 인간에 대한 간접적 의무에 불과하다.
    source: 칸트, 『윤리학 강의록』 · 최훈, 『동물을 위한 윤리학』(사월의책)에서 재인용
    note: "칸트는 이성과 자율성이 없는 동물에게는 **직접 의무를 지지 않는다**고 보았습니다. 그렇다고 동물을 아무렇게나 대해도 된다는 뜻은 아니었습니다."
  - type: quote
    label: 칸트 ② 늙은 개를 쏜 사람
    who: 칸트
    text: 그가 인간의 감정을 억누를 생각이 아니라면, 동물에 대한 친절함을 실천해야 한다. 동물에게 잔인한 사람은 사람을 대할 때도 가혹하기 때문이다. 우리는 동물을 어떻게 다루는지를 보고 사람의 마음씨를 판단할 수 있다.
    source: 칸트, 『윤리학 강의록』 · 최훈, 『동물을 위한 윤리학』(사월의책)에서 재인용
    note: "칸트는 그 행위가 그른 최종 근거를 **사람의 도덕성**에서 찾습니다. 동물을 잔혹하게 다루면 **함께 아파하는 마음이 무뎌지고** 도덕적 성향이 약해진다는 것입니다(『윤리형이상학』 「덕론」 §17)."
  - type: quote
    label: 교과서에서는
    text: 반려동물을 생명체라고 인식하지 않고, 물건이나 상품으로 취급하기 때문이다. 이러한 인식은 생명 경시로 이어진다. 반려동물을 함부로 대하는 사람은 동물을 넘어 인간의 생명도 존중하지 않을 경향이 높다.
    source: 『윤리문제 탐구』(길벗) 144쪽
    note: "길벗 『윤리문제 탐구』는 '내가 값을 치르고 사왔으니 괴롭히는 것도 내 마음'이라는 생각을 반려동물 학대의 뿌리로 짚습니다."
  - type: quote
    label: 교과서에서는 ② 삶의 주체
    text: 레건은 동물이 자신의 삶을 영위하는 주체임을 강조하였다. 그에 따르면 동물을 수단으로 취급하는 것은 쾌락과 고통의 문제를 넘어 동물이 지닌 가치와 권리를 부정하는 것이기 때문에 비윤리적이다.
    source: 『윤리문제 탐구』(길벗) 151쪽
    note: "동물 학대가 그른 까닭을 사람의 도덕성에서만 찾으면, **동물이 겪는 피해 자체**를 충분히 설명할 수 있을까요? 레건은 사람에게만 직접적 의무를 인정하는 관점에 이의를 제기하고, 동물을 **고유한 가치를 지닌 삶의 주체**로 보았습니다."
  - type: compare
    label: 같은 법, 다른 근거
    left:
      head: 벤담
      text: 동물이 다시 학대받을 위험과 고통을 줄인다
      note: "다치지 않았어도 고통은 있다 · 학대한 사람의 불이익도 함께 따진다(재범 위험, 최대 5년)"
    arrow: ↓ 함께 보기
    right:
      head: 칸트
      text: 사람의 도덕적 성향이 무뎌지는 것을 막는다
      note: 동물에 대한 의무는 사람에 대한 간접적 의무 · 그렇다면 동물이 겪는 피해 자체는? (레건은 동물을 삶의 주체로 본다)
  - type: pull
    who: 벤담
    text: 문제는 그것들이 이성적으로 사고할 수 있는가도 아니고 (…) 그것들이 고통을 느낄 수 있는가이다.
    source: 벤담, 『도덕과 입법의 원칙에 대한 서론』
  - type: lesson
    label: 수업 연계
    subjects:
      - "『윤리문제 탐구』 · 생태적 삶과 윤리적 탐구"
      - "『현대사회와 윤리』 · 생명 윤리와 생태 윤리"
      - "『통합사회1』 · 자연환경과 인간"
    cites:
      - "『윤리문제 탐구』(길벗) 144쪽, 150~151쪽"
    questions:
      - "다치지 않았어도 과태료를 물리는 조항을 벤담과 칸트는 각각 어떻게 설명할까?"
      - "고통의 감소, 사람의 도덕성, 동물의 권리 가운데 어떤 근거가 가장 설득력 있을까?"
  - type: end
