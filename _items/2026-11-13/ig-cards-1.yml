# 인스타그램 카드 뉴스 문안 — 2026-11-13 08:00 웹 발행, 08:05 게시. 카드 승인(11.12).
approved: true
# 게시 직후 첫 댓글(번호 댓글로 받는다. 팔로우 문구는 도구가 자동으로 붙인다)
poll:
  q: "온라인 절의 쉼, 종교가 주던 것을 대신할 수 있을까?"
  options:
    - "마음이 쉬면 충분하다!!"
    - "함께하는 자리까지는 못 된다!!"
  ask: "1번과 2번 중 하나를 고르고, 이유를 한 줄로 댓글에 남겨 주세요!"
cards:
  - type: cover
    image: /assets/art/an-gyeon-temple-bell.jpg
    focus: 50% 62%
    credit: 「연사모종(안개 낀 절의 저녁 종소리)」, 15세기 후반 안견 · 메트로폴리탄미술관(CC0)
    hook: 종교는 없어도 절하러 간다, 온라인 절 '산사'
    sub: 믿음도 대화도 없이 의례만 남긴 쉼은 무엇을 채워 줄까요? 엘리아데와 큉으로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 하루 10만 명
    big_note: 개발자가 SNS로 밝힌 하루 방문자 수(별도 검증된 통계는 아님)
    lines:
      - "10월 말, 브라우저에서 바로 열리는 **온라인 절 '산사'**가 공개되었습니다. 취업을 준비하던 26세 개발자가 **바이브 코딩**으로 만들었습니다."
      - "동자승 캐릭터로 법당을 걷고, **절하고, 염주를 굴리고**, 반야심경을 듣습니다. 옆에 사람이 앉아도 **말은 걸 수 없습니다.** 채팅이 없습니다."
      - "\"종교는 없지만 마음이 차분해졌다\"는 후기가 이어졌고, **온라인 성당과 교회**도 잇따라 나왔습니다."
  - type: text
    label: 왜 윤리 문제인가
    big: 60%
    big_note: 한국갤럽(2025) 조사에서 종교가 없다고 답한 사람. 20대 종교인은 24%
    lines:
      - "산사가 덜어 낸 것은 셋입니다. **믿음, 소속, 대화.** 남은 것은 **몸의 동작**입니다."
      - "길벗 『인문학과 윤리』(175쪽)는 우리를 가장 괴롭게 하는 것이 **남과 비교하며 불확실한 미래를 떠올릴 때의 불안**이라고 짚습니다."
      - "종교를 떠난 사람들은 **왜 여전히 절하고 싶어 할까?** 그리고 **동작만 남긴 쉼**은 종교가 주던 것을 얼마나 대신할까?"
  - type: quote
    label: 엘리아데 ① 누구나 종교적 인간
    who: 엘리아데
    text: 여기서 초월은 산이나 바다를 움직이는 기적을 의미하는 것이 아니라 인간이 사물에 의미를 부여하는 순간 그 자체이다. 즉, 인간이 느끼고 접촉하고 사랑한 모든 것은 언제든 '성스러운 것'이 될 수 있다.
    source: 『인문학과 윤리』(길벗) 177쪽
    note: "엘리아데는 세상을 **평범한 속(俗)**과 **성스러운 성(聖)**의 두 겹으로 보았습니다. 의미를 부여하는 순간, 무엇이든 성스러워질 수 있습니다."
  - type: quote
    label: 엘리아데 ② 세속적 인간은 종교적 인간의 후예
    who: 엘리아데
    text: 종교가 없는 사람의 대다수도 여전히 유사 종교와 타락한 신화를 가지고 있다는 것이다. 이것은 하나도 놀라울 것이 없다. 왜냐하면 (…) 세속적인 인간은 종교적 인간의 후예이며, 그는 자신의 역사를 지워버릴 수 없기 때문이다.
    source: 엘리아데, 『성과 속』(이은봉 옮김, 한길사)
    note: "새해 다짐, 이사한 날의 들뜬 기분에도 **의례의 모양**이 남아 있습니다. 브라우저 창 하나가 누군가에게는 **출근 전 들르는 성지**가 된 셈입니다."
  - type: quote
    label: 엘리아데 ③ 그런데 한계가 있다
    who: 엘리아데
    text: 근대인의 불안, 꿈이나 환상의 체험도 비록 형태상으로는 '종교적'이지만, 더 이상 종교적 인간의 경우에서처럼 세계관의 일부를 형성하지는 못하며, 따라서 행동의 체계를 위한 기초를 제공하지도 않는다.
    source: 엘리아데, 『성과 속』(이은봉 옮김, 한길사)
    note: "마음이 잠시 가라앉는 것과, **그 마음으로 어떻게 살지 아는 것**은 다른 일입니다."
  - type: quote
    label: 큉 ① 불안은 시대의 현상
    who: 큉
    text: 매일 대중 매체를 통해 자원 고갈, 교통 문제, 환경 오염, 삼림 파괴, 이상 기후, 대량 실업, 외채 위기, 제3세계 문제, 과대 군비, 핵 전쟁 등의 표어가 반복되고 있다. 기술이 가져다준 위대한 승리와 재난이 공존하고 있다.
    source: 큉, 『세계윤리 구상』 · 『인문학과 윤리』(길벗) 176쪽
    note: "큉은 오늘의 불안을 **개인의 감정이 아니라 시대의 현상**으로 보았습니다."
  - type: quote
    label: 큉 ② 종교의 두 몫
    text: 종교는 사람들에게 불완전한 인간 본성을 수용할 수 있는 안식처를 제공하며, 불의에 저항할 수 있는 양심과 용기의 원천이 된다.
    source: 『인문학과 윤리』(길벗) 181쪽(교과서의 풀이)
    note: "산사는 **안식처의 몫**은 해냅니다. 그런데 **이웃을 향한 사랑과 양심**은 말없이 혼자 앉아 있는 동안에는 생기기 어렵습니다."
  - type: compare
    label: 산사가 덜어 낸 것과 남긴 것
    left:
      head: 덜어 낸 것
      text: 믿음, 소속, 대화. 신자가 아니어도, 어느 절에 다니지 않아도, 누구와 말을 섞지 않아도 됩니다.
      note: "남긴 것: 절하기, 염주 굴리기, 앉아 있기"
    arrow: ↓ 그래서 아직 비어 있는 것
    right:
      head: 서로 돌보는 자리
      text: 불안을 내려놓을 고요한 자리는 찾았지만, 함께 나누고 기대는 자리와 삶의 기준이 되는 가르침은 비어 있습니다.
      note: 산사의 실패가 아니라 우리 사회의 빈자리입니다.
  - type: pull
    who: "엘리아데"
    text: "세속적인 인간은 종교적 인간의 후예이며, 그는 자신의 역사를 지워버릴 수 없기 때문이다."
    source: "엘리아데, 『성과 속』(이은봉 옮김, 한길사)"
  - type: lesson
    label: 수업 연계
    subjects:
      - "『인문학과 윤리』 · 삶의 의미에 대한 물음"
      - "『현대사회와 윤리』 · 문화와 경제생활의 윤리"
      - "『통합사회1』 · 문화와 다양성"
      - "교과서 인용: 『인문학과 윤리』(길벗) 175~179·181~182쪽"
    questions:
      - "온라인 성당·교회·추모 공간 같은 사례를 엘리아데의 성과 속으로 나누면 어떻게 될까?"
      - "대화를 없앤 설계는 공동체에 무엇을 주고 무엇을 앗아 갈까?"
  - type: end
