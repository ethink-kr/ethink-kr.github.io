# 인스타그램 카드 뉴스 문안 — 2026-11-09 발행(웹), 카드 승인(11.9).
approved: true
cards:
  - type: cover
    image: /assets/art/bruegel-childrens-games.jpg
    focus: 50% 60%
    credit: 「아이들의 놀이」, 1560년 피터르 브뤼헐 · 퍼블릭 도메인
    hook: 14세 미만은 SNS 금지, 막아도 될까?
    sub: 정부가 청소년 SNS 이용 제한을 검토합니다. 밀과 아리스토텔레스로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 14세 미만
    big_note: 보도된 방송미디어통신위원회 검토 방안 속 SNS 가입 제한 나이(확정 아님, 보호자 동의 시 허용안도 논의)
    lines:
      - "11월 3일 국무회의에서 대통령이 청소년 SNS 제한 논의를 **\"세밀하게, 신속하게\"** 진행하라고 지시했습니다."
      - "19세 미만 계정은 **맞춤 추천·무한 스크롤을 기본으로 제한**하는 안도 검토합니다. 대응 방안은 **2027년 상반기**까지 나옵니다."
      - "반대 의견도 큽니다. **연령 확인과 개인정보**, 우회 가능성, **표현과 정보 접근의 자유**가 쟁점입니다."
  - type: text
    label: 해외는 길이 다르다
    lines:
      - "**가입을 막는다.** 호주는 2025년 12월부터 16세 미만의 SNS 계정을 금지했습니다. 책임은 플랫폼이 집니다. 이 법은 지금 위헌 심리 중입니다."
      - "**프랑스**의 15세 미만 금지 조항은 8월 헌법위원회에서 **위헌** 결정을 받았습니다. 표현의 자유를 지나치게 제한한다는 이유였습니다."
      - "**기능을 막는다.** 미국 캘리포니아는 16세 미만에게 **맞춤 피드·무한 스크롤·자동 재생**을 막는 법을 만들었습니다(2027년 시행 예정). 구글·메타·틱톡이 소송을 냈습니다."
  - type: quote
    label: 밀 ① 해악의 원리
    who: 밀
    text: 다른 사람에게 해를 끼치는 것을 막기 위한 목적이라면, 당사자의 의지에 반해 권력이 사용되는 것도 정당하다고 할 수 있다. (…) 본인 자신의 물리적 또는 도덕적 이익을 위한다는 명목 아래 간섭하는 것도 일절 허용되지 않는다.
    source: 밀, 『자유론』(서병훈 옮김, 책세상)
    note: "남을 해치는 행동은 막을 수 있지만, **\"너를 위해서\"라는 이유로는** 막을 수 없습니다. 길벗 『인문학과 윤리』(117쪽)에 실린 대목대로, 사회가 할 수 있는 일은 **충고, 훈계, 설득**입니다."
  - type: quote
    label: 밀 ② 그런데 단서가 있다
    who: 밀
    text: 이 원리가 정신적으로 성숙한 사람에게만 적용될 수 있다는 사실을 굳이 부연할 필요는 없을 것이다. (…) 아직 다른 사람의 보호를 받아야 할 처지에 있는 사람들은 외부의 위험 못지않게 자신의 행동에 따른 결과로부터도 보호받아야 마땅하다.
    source: 밀, 『자유론』(서병훈 옮김, 책세상)
    note: "청소년은 **보호받아야 할 사람**입니다. 다만 밀은 **몇 살부터 성숙한지** 정하지 않았습니다. 14세, 16세, 19세 가운데 어디에 선을 그을지는 우리가 정합니다."
  - type: quote
    label: 밀 ③ 판단력은 근육이다
    who: 밀
    text: 사람의 지각, 판단, 특이한 감정, 정신 활동, 그리고 심지어 도덕적 선호와 같은 능력도 오직 선택을 거듭하는 과정을 통해서만 단련될 수 있다. (…) 근육과 마찬가지로 사람의 정신이나 도덕적 힘도 자꾸 써야 커진다.
    source: 밀, 『자유론』 · 『인문학과 윤리』(길벗) 112쪽
    note: "교과서는 이를 **보조성의 원리**로 소개합니다. 스스로 할 수 있는 일을 누군가 대신 해 주어서는 안 된다는 것입니다. 16살 생일에 **갑자기** SNS를 잘 쓸 수 있을까요?"
  - type: quote
    label: 교과서에서는 독약의 비유
    who: 밀
    text: 독약은 살인 이외의 목적으로, 게다가 어떤 경우에는 유용한 목적으로도 사용되기 때문에, 용도에 따라 규제를 달리하지 않고, 독약의 제조와 판매를 법으로 무조건 금지하는 것은 옳지 않다. 그런데도 다시 한번 말하지만, 사고를 미리 막는 것은 공권력의 고유한 일이다.
    source: 『윤리문제 탐구』(길벗) 31쪽
    note: "SNS도 쓰임이 여럿입니다. **유익한 쓰임까지 함께 막아도 될까요?** 다만 밀은 청소년 보호를 따로 다루니, 이 비유만으로 **가입 제한이 부당하다고 할 수는 없습니다.**"
  - type: quote
    label: 교과서에서는 도박장과 손님
    text: 밀은 도박을 금지해야 하는지를 놓고 벌어졌던 논란에 대해, 불법 도박장을 연 자는 처벌해야 하지만 여기에 가는 사람들을 처벌해서는 안 된다고 주장하였다.
    source: 『인문학과 윤리』(길벗) 117쪽
    note: "**판을 연 쪽은 규제하고, 들어온 사람은 처벌하지 않습니다.** 호주도 16세 미만 계정을 막으면서 **처벌은 플랫폼에만** 합니다. 청소년과 부모는 처벌하지 않습니다."
  - type: quote
    label: 아리스토텔레스 ① 습관이 모든 차이를 만든다
    who: 아리스토텔레스
    text: 어린 시절부터 죽 이렇게 습관을 들였는지, 혹은 저렇게 습관을 들였는지는 결코 사소한 차이를 만드는 것이 아니다. 그것은 대단히 큰 차이, 아니 모든 차이를 만드는 것이다.
    source: 아리스토텔레스, 『니코마코스 윤리학』(이창우·김재홍·강상진 옮김, 이제이북스)
    note: "우리는 **절제 있는 일을 해서 절제 있는 사람**이 됩니다. \"그만 봐야지\" 하면서 계속 넘기는 것, 교과서는 이것을 **의지의 나약함**이라 부릅니다."
  - type: quote
    label: 아리스토텔레스 ② 그래서 법이 필요하다
    who: 아리스토텔레스
    text: 절제 있고 강인하게 사는 것은 다중들에게, 특히 젊은이들에게 즐거운 일이 아니니까. 그런 까닭에 그들의 교육과 그들이 해야 할 일은 법에 의해 규정되어야만 한다. 일단 익숙해지고 나면 고통스럽지 않을 테니까.
    source: 아리스토텔레스, 『니코마코스 윤리학』(이창우·김재홍·강상진 옮김, 이제이북스)
    note: "절제는 처음엔 괴롭습니다. 그래서 **말만으로는 안 되고 법이 필요하다**고 봅니다. 제한에 찬성하는 쪽의 근거가 됩니다."
  - type: quote
    label: 아리스토텔레스 ③ 그런데 사람마다 처방이 다르다
    who: 아리스토텔레스
    text: 개별적인 수준의 교육은 공동체 수준의 그것보다 낫다. 열병을 앓고 있는 사람에게는 일반적으로 휴식과 금식이 도움이 되지만, 아마도 어떤 사람에게는 그렇지 않을 것이기 때문이다.
    source: 아리스토텔레스, 『니코마코스 윤리학』(이창우·김재홍·강상진 옮김, 이제이북스)
    note: "나이로 일괄 막는 규칙은 **모두에게 같은 처방**입니다. 그렇다면 접근을 제한하는 동안에도 **스스로 조절하는 힘**을 어떻게 기를지 물어야 합니다."
  - type: end
