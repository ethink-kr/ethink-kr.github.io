# 인스타그램 카드 뉴스 문안 — 초안(웹 발행일은 '올려' 지시일로 바뀜). 승인 전.
approved: false
# 게시 직후 첫 댓글: 두 입장 투표(2026-11-14 양식). 팔로우 문구는 도구가 자동으로 붙인다
poll:
  q: "AI 시대, 자격은 무엇으로 증명해야 할까?"
  options:
    - "감독을 강화해서라도 시험을 지켜야 한다!!"
    - "시험 방식부터 바꿔야 한다!!"
  ask: "1번과 2번 중 하나를 고르고, 이유를 한 줄로 댓글에 남겨 주세요!"
cards:
  - type: cover
    image: /assets/art/wen-zhengming-cassia-grove.jpg
    focus: 50% 55%
    credit: 「총계재도」, 1532년 무렵 문징명 · 과거 급제를 축하해 그린 그림 · 메트로폴리탄미술관(CC0)
    hook: 1등의 자백, 시험이 증명하던 자격은 어디로 가나?
    sub: 세무사 시험 수석 합격자가 AI 부정행위를 자수했습니다. 정약용과 프롬으로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 1문제
    big_note: 보도된 수석 합격자의 1차 시험 오답 수(160문제 가운데)
    lines:
      - "11월 15일, 제63회 세무사 시험 **수석 합격자**가 부정행위를 했다고 **스스로 밝혔습니다.** 경찰 수사가 막 시작된 단계입니다."
      - "**초소형 카메라**로 문제를 찍어 **생성형 AI**로 보내고, 스마트폰으로 답을 확인했다고 합니다. 1차와 2차 시험 모두입니다."
      - "시험장에는 감독관이 있었지만, 운영 기관은 당시 **이상한 행동을 확인하지 못했다**고 밝혔습니다."
  - type: text
    label: 이번 일만이 아니다
    big: 28만 5천 개
    big_note: 한국은행 분석, 4년(2022.6~2026.6) 동안 줄어든 청년 일자리. 94%가 AI에 많이 노출된 업종
    lines:
      - "올해 국가기술자격 필기시험에서 **스마트 안경 부정행위 5건**이 적발되었습니다(10.23 국정감사)."
      - "정지우 작가·변호사는 **시험으로 자격을 주는 방식이 끝나 가고 있다**고 썼습니다."
      - "다만 한국은행은 청년 일자리 감소를 **AI만으로는 다 설명할 수 없다**고 덧붙였습니다."
  - type: text
    label: 왜 윤리 문제인가
    lines:
      - "자격증은 **이 사람에게 일을 맡겨도 된다는 사회의 약속**입니다. 한 사람의 부정은 **차석 합격자, 다른 합격자, 납세자**의 신뢰를 함께 무너뜨립니다."
      - "그리고 더 큰 물음이 남습니다. AI가 답을 대신 찾아 주는 시대에, **사람의 일과 자격은 무엇으로 증명해야 할까?**"
  - type: quote
    label: 정약용 ① 이 자리는 구하지 마라
    who: 정약용
    text: 다른 벼슬은 구해도 좋으나 목민의 벼슬은 구해서는 안 된다.
    source: 정약용, 『목민심서』(다산연구회 옮김, 창비)
    note: "목민(牧民)은 **백성을 돌보는 일**입니다. 길벗 『인문학과 윤리』(145쪽)는 목민관의 자리가 **사리사욕을 채우는 자리가 아니라 백성의 삶을 보살피는 자리**이기 때문이라고 풀이합니다."
  - type: quote
    label: 정약용 ② 자리를 위하여 사람을 고른다
    who: 정약용
    text: 집이 가난하고 부모가 늙어 끼니를 잇기 어려운 사정은 실로 딱하다. 그러나 천지의 공리에 벼슬자리를 위하여 사람을 택하는 법은 있으나, 사람을 위하여 벼슬자리를 고르는 법은 없다.
    source: 정약용, 『목민심서』(다산연구회 옮김, 창비)
    note: "자수한 합격자는 **부모님의 자랑이 되고 싶었다**고 말했습니다. 사정은 딱합니다. 그러나 자리는 **그 자리가 돌볼 사람들**을 위해 있습니다."
  - type: quote
    label: 정약용 ③ 공부의 절반은 남을 돌보는 일
    who: 정약용
    text: 군자의 학문은 절반이 수신(修身)이고 나머지 절반은 목민이다.
    source: 정약용, 『목민심서』, 「자서」 · 『인문학과 윤리』(길벗) 145쪽
    note: "점수만 얻으면 되는 공부에서는 **나를 닦는 일**도, **그 공부로 돌볼 사람**도 빠집니다."
  - type: quote
    label: 프롬 ① 수단이 목적이 될 때
    who: 프롬
    text: 결국 목적이 되어버린 수단, 사물의 생산만이 중요한 과정에서 우리는 우리 자신을 사물로 바꾼다.
    source: 프롬, 『우리는 여전히 삶을 사랑하는가』 · 『인문학과 윤리』(길벗) 143쪽
    note: "자격증은 본래 **일을 잘하기 위한 수단**입니다. 합격 자체가 목적이 되면, 공부하는 나는 **합격증을 만드는 도구**가 됩니다."
  - type: quote
    label: 프롬 ② 가진 것이 곧 나라면
    who: 프롬
    text: 내가 가진 것이 곧 나라면 소유하고 있는 것을 잃어버렸을 때 나는 누구일 것인가?
    source: 『인문학과 윤리』(길벗) 144쪽(교과서의 정리)
    note: "합격증은 **가지는 것**이고, 세무사로 일한다는 것은 그 지식으로 사람을 돕는 사람으로 **있는 것**입니다. AI로 얻은 합격증은 가질 수는 있어도, **그 사람으로 있게 해 주지는 못합니다.**"
  - type: compare
    label: 자격은 무엇을 증명해야 할까
    left:
      head: 시험이 증명하던 것
      text: 정해진 시간 안에, 혼자 힘으로, 정답을 찾아내는 능력
      note: "AI가 흔든 것: '혼자 힘으로'를 확인하는 방법"
    arrow: ↓ 그래서 새로 증명해야 할 것
    right:
      head: 사람을 만나 판단하고 책임지는 능력
      text: 정답 찾기는 AI가 더 빠릅니다. 사람의 사정을 듣고, 겪은 것을 바탕으로 판단하고, 그 판단에 책임지는 일은 그 사람 자신에게서 나옵니다.
      note: 개인의 각오만이 아니라, 청년이 경험을 쌓을 '경력 사다리'를 만드는 사회의 몫도 함께입니다.
  - type: pull
    who: 정약용
    text: 벼슬자리를 위하여 사람을 택하는 법은 있으나, 사람을 위하여 벼슬자리를 고르는 법은 없다.
    source: 정약용, 『목민심서』
  - type: lesson
    label: 수업 연계
    subjects:
      - "『인문학과 윤리』 · 삶의 방식으로서 소유와 존재란 무엇일까"
      - "『현대사회와 윤리』 · 현대 생활과 윤리"
      - "『현대사회와 윤리』 · 과학과 디지털 학습 환경 윤리"
      - "『인문학과 윤리』(길벗) 143~145쪽, 활동 146~147쪽"
    questions:
      - "AI 부정행위를 막으려면 감시를 늘려야 할까, 평가 방식을 바꿔야 할까?"
      - "내가 얻고 싶은 자격증은 누구를 위해 있는 자리일까?"
  - type: end
