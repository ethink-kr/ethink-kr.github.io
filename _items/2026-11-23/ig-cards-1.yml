# 인스타그램 카드 뉴스 문안 — 2026-11-23 08:00 웹 발행, 08:00 게시. 카드 승인(11.22).
approved: true
poll:
  q: "들키지 않는다면, 시험에서 AI의 도움을 받아도 될까?"
  options:
    - "들키지 않아도 하면 안 된다!!"
    - "걸리지 않으면 문제없다!!"
  ask: "1번과 2번 중 하나를 고르고, 이유를 한 줄로 댓글에 남겨 주세요!"
cards:
  - type: cover
    image: /assets/art/steen-school.jpg
    focus: 55% 45%
    credit: 「소년과 소녀를 위한 학교」, 1670년경 얀 스테인 · 퍼블릭 도메인
    hook: 투명 인간이 되어 시험을 친다면, 그래도 정직할까?
    sub: 수능 부정행위 98명, 세무사 수석 합격자의 자백. 플라톤의 기게스의 반지와 공자로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    big: 98명
    big_note: 11월 19일 수능, 스마트기기 등 전자기기 관련 부정행위자(교육부, 4교시 종료 기준)
    lines:
      - "49명은 **위급재난문자 알림**을 계기로 적발됐습니다. 시험 도중 **스마트안경, 소형 카메라·무선 이어폰 소지, 문제지 촬영** 같은 스마트기기 부정행위도 5건 확인됐습니다."
      - "올해 **세무사 시험 수석 합격자**는 초소형 카메라로 시험지를 찍어 **AI로 답을 확인했다**고 털어놓았습니다. 자수 전 공단의 답안 검토에서는 **특이사항을 찾지 못했습니다.**"
  - type: text
    label: 왜 윤리 문제인가
    lines:
      - "수능에서는 그 자리에서 걸렸고, 세무사 시험에서는 **걸리지 않고 수석까지** 했습니다. 스마트안경, 초소형 카메라, AI가 나오면서 **감독관의 눈은 점점 더 많은 것을 놓칩니다.**"
      - "감독이 다 보지 못한다면? 질문은 이렇게 됩니다. **들키지 않는다면, 부정행위를 하지 않을 이유가 있는가?**"
  - type: quote
    label: 플라톤 ① 기게스의 반지
    who: 글라우콘
    text: 반지의 보석받이(거미발)를 자신을 향해 손 안쪽으로 돌렸는데, 이 일이 있자 그 자신이 동석한 사람들에게 보이지 않게 되어 (…) 왕비와 더불어 왕을 덮쳐 살해한 다음, 왕국을 장악했다고 합니다.
    source: 플라톤, 『국가·정체』(박종현 역주, 서광사)
    note: "글라우콘은 누구든 이 반지를 얻으면 똑같이 행동할 것이라 봅니다. **아무도 자발적으로 올바르려고 하지 않는다**는 것입니다. 오늘의 반지는 **초소형 카메라와 AI**입니다."
  - type: quote
    label: 플라톤 ② 올바른 듯 보이는 것
    who: 글라우콘
    text: 그러나 체포되는 자는 신통치 못한 자로 간주되어야 합니다. 최상급의 올바르지 못함은 실제로는 올바르지 않으면서 올바른 듯이 보이는 것이니까요.
    source: 플라톤, 『국가·정체』(박종현 역주, 서광사)
    note: "글라우콘은 부정한 일을 하고도 **올바르다는 평판**을 얻는 사람을 가정합니다. 시험으로 옮기면 걸리지 않은 **수석 합격**입니다. 반대로 올바르지만 **악명을 뒤집어쓴 사람**도 세웁니다. 평판과 실제는 어느 쪽으로든 어긋날 수 있습니다."
  - type: quote
    label: 플라톤 ③ 소크라테스의 대답
    who: 소크라테스
    text: 몰래 올바르지 못한 짓을 하고서도 처벌을 받지 않는 것이 어떻게 해서 이익이 되는가? 아니, 그러고서도 발각되지 않은 자는 한결 더 사악하게 되지 않겠는가?
    source: 플라톤, 『국가·정체』(박종현 역주, 서광사)
    note: "소크라테스에게 부정의 대가는 처벌이 아니라 **혼이 망가지는 것**입니다. 들키지 않으면 그 망가짐이 계속되고, 벌을 받는 것은 **혼을 바로잡을 기회**가 됩니다."
  - type: quote
    label: 공자 ① 누구를 위한 공부인가
    who: 공자
    text: 옛날의 학자들은 자기를 위해서 학문했으나 지금의 학자들은 남을 위해 학문한다.
    source: 『논어』, 「헌문」 · 이기동, 『논어강설』(성균관대학교출판부)
    note: "'자기를 위한 공부'는 **배운 것을 자기 것으로 만들어 실천하는** 공부, '남을 위한 공부'는 **남에게 인정받는 데 마음이 쏠린** 공부입니다. 다른 도움으로 얻은 점수로는 **본인의 실력을 알 수 없습니다.**"
  - type: quote
    label: 교과서에서는
    who: 공자
    text: 배우고 때맞추어 실천하면 기쁘지 않은가! 벗이 먼 데서 찾아오면 즐겁지 않은가! 남이 알아주지 않아도 서운해하지 않으면 군자답지 않은가!
    source: 『논어』, 「학이」 · 『인문학과 윤리』(길벗) 60쪽
    note: "첫 기쁨은 **배우고 익히는 데서** 옵니다. 부정행위는 그 기쁨은 건너뛰고 **남이 알아주는 것만** 가져갑니다. 플라톤의 말로 하면 '올바른 듯 보이는 것'만 가져가는 셈입니다."
  - type: compare
    label: 반지가 숨겨 주지 못하는 사람
    left:
      head: 플라톤
      text: 들키지 않는 부정은 혼을 망친다
      note: "보이는 것(평판)과 실제를 떼어 놓고 보면, 올바름은 그 자체로 좋은가"
    arrow: ↓ 함께 보기
    right:
      head: 공자
      text: 남에게 보이려는 공부는 자기를 잃게 한다
      note: 위기지학 · 남이 알아주지 않아도 서운해하지 않는 사람
  - type: pull
    who: 글라우콘
    text: 최상급의 올바르지 못함은 실제로는 올바르지 않으면서 올바른 듯이 보이는 것이니까요.
    source: 플라톤, 『국가·정체』
  - type: lesson
    label: 수업 연계
    subjects:
      - "『인문학과 윤리』 · 의미 있는 타자로서의 친구"
      - "『윤리와 사상』 · 서양 윤리 사상"
      - "『윤리와 사상』 · 동양 윤리 사상"
    cites:
      - "『인문학과 윤리』(길벗) 60쪽"
    questions:
      - "감독 기술을 더 높이면 시험 부정행위 문제는 해결될까?"
      - "내가 지금 하는 공부는 누구를 위한 것일까?"
  - type: end
