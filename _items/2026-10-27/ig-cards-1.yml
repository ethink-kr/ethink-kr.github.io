# 인스타그램 카드 뉴스 문안 — 2026-10-27 초안. 재형 님 승인 전까지 approved: false.
approved: false
cards:
  - type: cover
    image: /assets/art/qing-cheating.jpg
    focus: 50% 50%
    credit: 청나라 과거시험 부정행위 물품, 베이징 수도박물관 · CC0
    hook: 들키지 않는다면, AI의 도움을 받아도 될까?
    sub: 올해 수능부터 스마트안경이 반입 금지 물품으로 분명히 적혔습니다. 칸트와 『대학』으로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    lines:
      - "**11월 19일 수능**: 평가원이 10월 15일 수험생 유의사항에 스마트안경을 반입 금지 물품으로 적었습니다."
      - "**시험 중 착용**하면 실제로 썼는지와 상관없이 중대한 부정행위입니다. 그해 시험이 무효가 되고, **다음 해 수능에도 응시할 수 없습니다.**"
      - "올해 **토익·자격시험**, **서울시립대(10.3)·연세대(10.10) 논술**에서 스마트안경이 적발되었습니다."
  - type: quote
    label: 칸트 ① 모두가 그렇게 한다면
    who: 칸트
    text: 네 의지의 준칙이 언제나 동시에 보편적 입법의 원리가 될 수 있도록 행위하라.
    source: 『윤리와 사상』 교과서
    note: "'준칙'은 \"나는 이럴 때 이렇게 하겠다\"라는 나만의 원칙입니다. 칸트는 그 원칙을 **모든 사람이 따라도** 괜찮은지 먼저 물어보라고 합니다."
  - type: quote
    label: 칸트 ② 거짓 약속의 물음
    who: 칸트
    text: 나는, (진실하지 못한 약속을 통해 곤경에서 벗어난다는) 나의 준칙이 (나뿐만 아니라 다른 사람을 위한) 보편적 법칙으로 타당해야 한다는 것에 정말로 만족할 것인가?
    source: 칸트, 『윤리형이상학 정초』(백종현 옮김, 아카넷)
    note: 칸트가 든 예는 **갚을 생각 없이 돈을 빌리는 거짓 약속**입니다. 시험 부정행위를 다룬 말은 아닙니다.
  - type: quote
    label: 칸트 ③ 아예 약속이 없어진다
    who: 칸트
    text: 이렇고 보면 나는 이내, 내가 비록 거짓말을 할 수는 있지만, 도무지 거짓말하는 것을 보편적 법칙으로 의욕할 수는 없음을 깨닫게 된다. 왜냐하면 그러한 법칙에 따르게 되면 아예 약속이라는 것이 있을 수 없게 될 터이기 때문이다.
    source: 칸트, 『윤리형이상학 정초』(백종현 옮김, 아카넷)
    note: 누구나 거짓 약속을 하면 아무도 약속을 믿지 않습니다. 믿어 주는 사람이 없으니 **거짓 약속으로 돈을 빌릴 수도 없습니다.**
  - type: flow
    label: 칸트의 질문을 시험에 적용하면
    steps:
      - ["준칙 쓰기", "들키지 않는다면, 시험 규칙을 어기고 AI의 도움을 받겠다."]
      - ["모두가 따른다고 상상하기", "모든 수험생이 몰래 AI의 도움을 받습니다."]
      - ["어떻게 될까?", "점수는 더 이상 각자의 실력을 보여 주지 못하고, 시험이라는 제도가 의미를 잃습니다."]
      - ["판단", "나만 어기고 다른 사람은 지켜 줄 때만 통하는 준칙입니다. 칸트의 기준으로는 허용될 수 없습니다."]
  - type: quote
    label: 『대학』 홀로 있음을 삼가라
    text: 이른바 그 뜻을 정성스럽게 한다는 것은 자기를 속이지 아니하는 것이니, 나쁜 냄새를 싫어하는 것처럼 하며 좋은 빛을 좋아하는 것처럼 하는 것이다. (…) 그러므로 군자는 반드시 그 홀로 있음을 삼가는 것이다.
    source: 『대학』(이기동 역해, 성균관대학교출판부)
    note: 나쁜 냄새는 **따져 보지 않아도 저절로** 싫습니다. 옳은 일을 하려는 마음도 그렇게 우러나야 합니다. 남이 모를 때일수록 더 조심하는 것, 이것이 '신독(愼獨)'입니다.
  - type: notes
    label: 교과서에서는 ① 칸트
    lines:
      - "\"칸트는 개인이 선택한 준칙을 다른 모든 사람이 보편적으로 받아들일 수 있다면 그 준칙은 비로소 도덕법칙이 될 수 있다고 주장하였다.\" — 『윤리와 사상』"
      - "\"도덕적 행위란 보편화할 수 있는 원리에 부합하는 행위이다.\" — 『윤리와 사상』"
      - "\"거짓 약속은 보편화가 가능한가?\" 교과서는 이 물음을 **직접 생각해 보는 활동**으로 제시합니다. — 『윤리와 사상』"
  - type: notes
    label: 교과서에서는 ② 신독
    lines:
      - "\"수양은 본래 보상이나 처벌과 상관없기 때문인데, 이를 유학에서는 신독(愼獨)이라고 한다.\" — 『인문학과 윤리』(길벗) 17쪽"
      - "\"신독은 홀로 있을 때에도 마땅한 도리에 어긋남이 없도록 몸가짐을 바르게 하고 말과 행동을 삼간다는 뜻이다.\" — 『인문학과 윤리』(길벗) 17쪽"
  - type: end
    question: 들키지 않는다면, AI의 도움을 받아 시험을 쳐도 되는가?
    ask: 감독이 닿지 않는 곳에서도 지켜야 하는 규칙이 있다면, 그 이유는 무엇일까요? 생각을 댓글로 남겨 주세요. 한 줄이어도 좋습니다.
