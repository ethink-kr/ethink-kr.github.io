# 인스타그램 카드 뉴스 문안 — 2026-10-29, 재형 님 승인(10.28).
approved: true
cards:
  - type: cover
    image: /assets/art/fetti-good-samaritan.jpg
    focus: 50% 62%
    credit: 「착한 사마리아인」, 1618~1622년경 도메니코 페티 · 메트로폴리탄미술관(CC0)
    hook: 출발선이 다른 학생, 같은 시험이 공정할까?
    sub: 서강대 난민 전형의 장학·정착 지원을 두고 의견이 나뉘었습니다. 레비나스와 샌델로 읽습니다.
  - type: text
    label: 무슨 일이 있었나
    lines:
      - "서강대는 **외국인 난민 전형**으로 2027학년도 신입생을 뽑습니다. 수능 성적은 보지 않고 고교 성적과 어학 증명서 같은 서류로 선발합니다."
      - "정원 외 전형이고 모집 인원은 **'제한 없음'**입니다. 지원하면 모두 합격한다는 뜻은 아닙니다."
      - "이번에 주목받은 것은 **장학·정착 지원**입니다. 법무부·기쁨나눔재단과 함께 **해마다 2명**을 장학생으로 뽑아 최대 8학기 등록금 전액을 줍니다."
      - "10월 23일 보도 뒤 \"국내 학생도 어려운데\"라는 반발과 \"우리도 도움을 받았다\"는 의견이 나뉘었습니다."
  - type: quote
    label: 레비나스 ① 낯선 이로 오는 타자
    who: 레비나스
    text: 타자는 자신을 나의 방해물이거나 적으로 대립시킴이 없이 낯선 이로 그 자신을 드러낸다.
    source: 레비나스, 『전체성과 무한』 · 『윤리와 사상』 교과서
    note: "'타자'는 내가 다 알 수 없는 사람입니다. 레비나스는 타자가 **'얼굴'**로 나에게 온다고 말합니다. 생김새가 아니라, 상처받기 쉬운 모습으로 내 앞에 선 사람과의 만남입니다."
  - type: quote
    label: 레비나스 ② 얼굴이 건네는 의무
    who: 레비나스
    text: 타자는 나를 바라보며, 나를 문제 삼으며, 무한성으로서의 그의 본질에 의하여 나에게 의무를 부과한다.
    source: 레비나스, 『전체성과 무한』 · 『윤리와 사상』 교과서
    note: "레비나스가 자주 드는 예는 『구약 성경』의 **\"나그네와 과부와 고아\"**입니다. 힘으로 나를 누르지 않는데도 나에게 무언가를 요구합니다."
  - type: text
    label: 레비나스 ③ 지갑과 집 문을 열다
    image: /assets/art/rembrandt-abraham-angels.jpg
    focus: 50% 60%
    credit: 「천사들을 대접하는 아브라함」, 1656년 렘브란트 · 메트로폴리탄미술관(CC0)
    lines:
      - "호소에 응답해 낯선 사람을 맞아들이는 일을 레비나스는 **'환대'**라고 불렀습니다."
      - "\"(줌과 바침은) 마음의 선물이 아니라 자신의 입에 든 빵, 입에 가득한 빵을 내어주는 것이다.\" — 강영안, 『타인의 얼굴: 레비나스의 철학』(문학과지성사)에서 재인용"
      - "등록금을 내주고 입학의 문을 여는 일은 이 **'집 문을 열어 주는 일'**에 가깝습니다."
  - type: text
    label: 레비나스 ④ 제삼자가 나타나면
    lines:
      - "내 앞에는 낯선 청년만 있지 않습니다. 돈이 없어 공부를 못 하는 **국내 학생**도, 뽑히지 못한 **다른 난민 학생**도 있습니다."
      - "레비나스는 이들을 **'제삼자'**라고 불렀습니다. 응답할 사람이 여럿이면 비교하고 조정해야 합니다. 그래서 제도와 정의가 필요해집니다."
      - "강영안은 이를 두고 \"삼자는 분배적, 사회적 정의의 시작\"이라고 풀이합니다."
  - type: quote
    label: 샌델 점수에는 무엇이 담겨 있나
    who: 샌델
    text: 실력대로라고? 사실 실력은 경제적 우위와 구별해서 보기가 어렵다. (…) 그러나 실제로는 SAT 점수와 수험생 집안의 소득이 비례관계를 나타낸다. 더 부유한 집 학생일수록 더 높은 점수를 얻을 가능성이 크다.
    source: 샌델, 『공정하다는 착각』(함규진 옮김, 미래엔)
    note: "같은 시험을 본다고 같은 출발선에 선 것은 아닙니다. 전쟁을 피해 온 학생은 학교를 오래 쉬었을 수 있고, **한국어가 모국어도 아닙니다.**"
  - type: notes
    label: 교과서에서는 ① 두 가지 평등
    lines:
      - "\"사회가 정의로운지 묻는 것은, 우리가 소중히 여기는 것들, 이를테면, 소득과 부, 의무와 권리, 권력과 기회, 공직과 영광 등을 어떻게 분배하는지 묻는 것이다.\" — 샌델, 『인문학과 윤리』(길벗) 92쪽"
      - "\"형식적 평등은 인종, 성별, 신분, 종교 등에 따른 차별 없이 누구에게나 똑같이 기회를 개방하는 것을 말한다.\" — 『인문학과 윤리』(길벗) 101쪽"
      - "\"실질적 평등은 사회적 불평등을 보정하기 위해 사회적으로 불이익을 받는 집단에 더욱 적극적인 조치를 취하는 것을 말한다.\" — 『인문학과 윤리』(길벗) 101쪽"
  - type: quote
    label: 교과서에서는 ② 묶인 다리로 달리기
    who: 존슨
    text: 두 사람이 100야드 달리기 경주를 하는데 한 사람의 다리는 묶어 놓았다고 치자. 이 사람이 10야드밖에 못 가는 동안 멀쩡한 사람은 50야드를 갔다. 이 순간 불공정을 시정할 수 있는 방법은 무엇일까? 묶은 것만 풀어 주면 될까? 그보다는 묶인 사람에게 40야드의 차이를 만회할 수 있는 기회를 주는 게 정의가 아닐까?
    source: 『인문학과 윤리』(길벗) 101쪽
    note: "**'적극적 평등 실현 조치'**는 케네디 정부의 1961년 행정명령에 처음 쓰였고, 린든 존슨(1963~1969년 미국 대통령)은 1965년 행정명령으로 이를 의무화했습니다. 위는 교과서에 실린 존슨의 연설입니다. 교과서는 이 조치에 **역차별이라는 주장**이 늘 따라다녔다고 덧붙입니다."
  - type: end
