# 사이트 빌드·배포. 글을 올릴 때(push)와 화·목·토 아침 9시(예약 발행)에 돌아갑니다.
# 예약 발행: 글 앞머리 date가 아직 오지 않은 글은 빌드에서 빠지고(_config.yml의 future: false),
# 정해진 시각에 다시 빌드되면서 그때 사이트에 나타납니다.
name: 사이트 빌드·배포
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 2,4,6'    # 화·목·토 09:00 KST (UTC 00:00)
    - cron: '30 0 * * 2,4,6'   # 09:30 KST 한 번 더 (GitHub 예약 실행이 늦어질 때 대비)
    - cron: '0 23 * * 2,4'     # 수·금 08:00 KST (UTC 화·목 23:00): 전날 웹에 낸 글의 인스타그램 카드 뉴스를 올립니다
    - cron: '30 23 * * 2,4'    # 수·금 08:30 KST 한 번 더
    - cron: '0 0 * * 0'        # 일 09:00 KST: 전날(토) 웹에 낸 글의 인스타그램 카드 뉴스를 올립니다
    - cron: '30 0 * * 0'       # 일 09:30 KST 한 번 더
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  instagram:
    # 예약 빌드(화·목·토 9시)와 수동 실행 때, 오늘 발행된 글을 인스타그램 @ethink.kr에 올립니다.
    # 저장소 Settings → Secrets에 IG_USER_ID, IG_ACCESS_TOKEN이 있어야 돌아갑니다(없으면 건너뜀).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 인스타그램에 어제 웹에 낸 글 올리기
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node _tools/ig-post.cjs
      - name: 갱신된 토큰 저장(GH_PAT가 있을 때만)
        if: env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="$RUNNER_TEMP/ig_token_new"
          if [ -s "$f" ]; then gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "IG_ACCESS_TOKEN 비밀을 새 토큰으로 바꿨습니다."; fi
