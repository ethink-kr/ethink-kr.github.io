# 사이트 빌드·배포. 글을 올릴 때(push)와 수동 실행(Run workflow) 때만 돌아갑니다. 예약 실행은 없습니다(2026-10-30, 재형 님 지시).
# 글 앞머리 date가 아직 오지 않은 글은 빌드에서 빠지므로(_config.yml의 future: false), 발행할 때는 date 시각이 지난 뒤 수동으로 실행합니다.
name: 사이트 빌드·배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  instagram:
    # 자동 게시는 쓰지 않습니다. 인스타그램은 「인스타그램 수동 작업」(ig-manual.yml)으로 날짜를 넣어 올립니다.
    # 저장소 Settings → Secrets에 IG_USER_ID, IG_ACCESS_TOKEN이 있어야 돌아갑니다(없으면 건너뜀).
    if: ${{ false }}
    needs: deploy
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 인스타그램에 어제 웹에 낸 글 올리기
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node _tools/ig-post.cjs
      - name: 갱신된 토큰 저장(GH_PAT가 있을 때만)
        if: env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="$RUNNER_TEMP/ig_token_new"
          if [ -s "$f" ]; then gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "IG_ACCESS_TOKEN 비밀을 새 토큰으로 바꿨습니다."; fi
