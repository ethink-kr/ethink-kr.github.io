# 인스타그램 수동 작업: 특정 날짜의 승인된 카드 뉴스를 올립니다(다시 올릴 때는 먼저 앱에서 예전 게시물을 지웁니다. API로는 지울 수 없습니다).
# Actions → 「인스타그램 수동 작업」 → Run workflow 에서 입력을 넣어 실행합니다.
name: 인스타그램 수동 작업
on:
  workflow_dispatch:
    inputs:
      post_day:
        description: 올릴 글 날짜 YYYY-MM-DD, 또는 편집자 노트 파일 _notes/YYYY-MM-DD-이름.yml
        required: true
permissions:
  contents: read
jobs:
  instagram:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: js-yaml 설치(편집자 노트 읽기)
        run: npm i --no-save js-yaml@4.1.0
      - name: 카드 뉴스 올리기
        run: node _tools/ig-post.cjs "${{ inputs.post_day }}"
      - name: 갱신된 토큰 저장(GH_PAT가 있을 때만)
        if: env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="$RUNNER_TEMP/ig_token_new"
          if [ -s "$f" ]; then gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$f" && echo "IG_ACCESS_TOKEN 비밀을 새 토큰으로 바꿨습니다."; fi
