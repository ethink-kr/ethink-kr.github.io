<p class="toast" id="toast" role="status" aria-live="polite"></p>
<script>
(function(){
  var t=document.getElementById('toast');
  function toast(m){if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},2600);}
  function copy(url,msg){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(function(){toast(msg||'링크를 복사했습니다.');},function(){toast(url);});}
    else{var a=document.createElement('textarea');a.value=url;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg||'링크를 복사했습니다.');}catch(e){toast(url);}a.remove();}
  }

  /* 공유 메뉴 */
  var openMenu=null;
  function close(){if(!openMenu)return;openMenu.menu.hidden=true;openMenu.btn.setAttribute('aria-expanded','false');openMenu=null;}
  document.querySelectorAll('.js-share').forEach(function(w){
    var btn=w.querySelector('.share-toggle'), menu=w.querySelector('.share-menu');
    btn.addEventListener('click',function(e){
      e.stopPropagation(); var was=openMenu&&openMenu.menu===menu; close(); if(was) return;
      menu.hidden=false; btn.setAttribute('aria-expanded','true'); openMenu={btn:btn,menu:menu};
      menu.style.left='';menu.style.right='';
      var r=menu.getBoundingClientRect(); if(r.right>window.innerWidth-8){menu.style.left='auto';menu.style.right='0';}
    });
    menu.addEventListener('click',function(e){e.stopPropagation(); if(e.target.closest('a')) close();});
  });
  document.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  document.querySelectorAll('.js-copy').forEach(function(b){b.addEventListener('click',function(){copy(b.getAttribute('data-url'));close();});});
  var KKEY={{ site.kakao_js_key | jsonify }};
  function kakaoReady(){return window.Kakao&&Kakao.isInitialized&&Kakao.isInitialized();}
  if(KKEY&&document.querySelector('.js-kakao')){
    var sc=document.createElement('script');
    sc.src='https://t1.kakaocdn.net/kakao_js_sdk/2.8.2/kakao.min.js';
    sc.integrity='sha384-zt/G7/KfaRQ9dT/QIkS0ujMtzouJqzuSJcXVQu50x0rl/+mD1dc70AeOejVbMD9E';
    sc.crossOrigin='anonymous';
    sc.onload=function(){try{if(!Kakao.isInitialized())Kakao.init(KKEY);}catch(e){}};
    document.head.appendChild(sc);
  }
  function fallbackShare(d){
    if(navigator.share){navigator.share(d).catch(function(){});}
    else{copy(d.url,'링크를 복사했습니다. 카카오톡 대화창에 붙여 넣어 주세요.');}
  }
  document.querySelectorAll('.js-kakao').forEach(function(b){b.addEventListener('click',function(){
    var d={title:b.getAttribute('data-title')||document.title,url:b.getAttribute('data-url')}; close();
    if(!kakaoReady()){fallbackShare(d);return;}
    try{Kakao.Share.sendScrap({requestUrl:d.url});}
    catch(e1){
      try{Kakao.Share.sendDefault({objectType:'feed',content:{title:d.title,description:{{ site.title | jsonify }}+' · '+{{ site.tagline | jsonify }},imageUrl:b.getAttribute('data-image'),link:{mobileWebUrl:d.url,webUrl:d.url}},buttons:[{title:'글 읽기',link:{mobileWebUrl:d.url,webUrl:d.url}}]});}
      catch(e2){fallbackShare(d);}
    }
  });});

  /* 찜하기 (이 브라우저에만 저장) */
  var KEY='saved-posts';
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];}}
  function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true;}catch(e){return false;}}
  function has(a,id){for(var i=0;i<a.length;i++){if(a[i].id===id)return i;}return -1;}
  function paintSaves(){
    var a=load();
    document.querySelectorAll('.js-save').forEach(function(b){
      var on=has(a,b.getAttribute('data-id'))>=0;
      b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
      b.querySelector('.save-ico').textContent=on?'★':'☆';
      b.querySelector('.save-txt').textContent='찜';
    });
    document.querySelectorAll('.js-saved-count').forEach(function(c){c.textContent=a.length?' '+a.length:'';});
  }
  document.querySelectorAll('.js-save').forEach(function(b){b.addEventListener('click',function(){
    var a=load(), id=b.getAttribute('data-id'), i=has(a,id);
    if(i>=0){a.splice(i,1); if(store(a)) toast('찜한 글에서 뺐습니다.');}
    else{a.unshift({id:id,url:b.getAttribute('data-url'),title:b.getAttribute('data-title'),at:Date.now()});
      if(store(a)) toast('찜했습니다. 위쪽 메뉴 「찜한 글」에서 모아 볼 수 있습니다.'); else toast('이 브라우저에서는 찜한 글을 저장할 수 없습니다.');}
    paintSaves(); renderSaved();
  });});
  function renderSaved(){
    var list=document.querySelector('.js-saved-list'); if(!list) return;
    var a=load(), empty=document.querySelector('.js-saved-empty'), tot=document.querySelector('.js-saved-total');
    list.innerHTML=''; if(tot) tot.textContent=a.length+'편'; if(empty) empty.hidden=a.length>0;
    a.forEach(function(p){
      var li=document.createElement('li'), link=document.createElement('a'), d=new Date(p.at);
      link.href=p.url; link.className='saved-link';
      var m=document.createElement('span'); m.className='mono'; m.textContent=d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. 찜';
      var ti=document.createElement('span'); ti.textContent=p.title;
      link.appendChild(m); link.appendChild(ti);
      var rm=document.createElement('button'); rm.type='button'; rm.className='saved-remove'; rm.textContent='빼기'; rm.setAttribute('aria-label',p.title+' 찜 빼기');
      rm.addEventListener('click',function(){var b=load(),i=has(b,p.id); if(i>=0){b.splice(i,1);store(b);} paintSaves(); renderSaved(); toast('찜한 글에서 뺐습니다.');});
      li.appendChild(link); li.appendChild(rm); list.appendChild(li);
    });
  }
  paintSaves(); renderSaved();

  /* 좋아요 */
  var api={{ site.likes_api | jsonify }}; if(!api) return;

  /* 방문 통계: 운영자만 보는 구글 시트에 쌓음. 개인정보 없이 브라우저별 무작위 번호만 씀.
     ?nostats=1 로 한 번 연 브라우저는 집계에서 빠짐(?nostats=0 이면 다시 셈). */
  (function(){
    try{
      var q=location.search;
      if(/[?&]nostats=1/.test(q)) localStorage.setItem('stats-off','1');
      if(/[?&]nostats=0/.test(q)) localStorage.removeItem('stats-off');
      if(localStorage.getItem('stats-off')==='1'||navigator.webdriver) return;
      var v=localStorage.getItem('stats-v');
      var f='';
      if(!v){v=Math.random().toString(36).slice(2,12)+Date.now().toString(36);localStorage.setItem('stats-v',v);f+='n';}
      var k=new Date(Date.now()+9*36e5), day=k.toISOString().slice(0,10);
      var dw=(k.getUTCDay()+6)%7, mon=new Date(k.getTime()-dw*864e5).toISOString().slice(0,10);
      var keys={d:day,w:mon,m:day.slice(0,7),y:day.slice(0,4)};
      Object.keys(keys).forEach(function(c){if(localStorage.getItem('stats-'+c)!==keys[c]){localStorage.setItem('stats-'+c,keys[c]);f+=c;}});
      /* 유입: ?from=표시(공유 버튼·직접 붙인 표시) > 앱 안 브라우저 > 이전 사이트 주소 */
      var fr='',m=q.match(/[?&]from=([a-z0-9\-]{1,20})/i);
      if(m){fr=m[1].toLowerCase();
        try{var cl=q.replace(/([?&])from=[^&]*&?/,'$1').replace(/[?&]$/,'');history.replaceState(null,'',location.pathname+cl+location.hash);}catch(e){}}
      var ua=navigator.userAgent||'', app='';
      if(/KAKAOTALK/i.test(ua))app='k';else if(/Instagram/i.test(ua))app='i';else if(/FBAN|FBAV/i.test(ua))app='f';
      else if(/NAVER\(inapp|NAVER\//i.test(ua))app='n';else if(/Barcelona/i.test(ua))app='t';else if(/DaumApps/i.test(ua))app='d';else if(/ Line\//i.test(ua))app='l';
      var r='',pv='';
      try{if(document.referrer){var ref=new URL(document.referrer);if(ref.hostname!==location.hostname)r=ref.hostname;else pv=ref.pathname.toLowerCase();}}catch(e){}
      var path=location.pathname.toLowerCase();
      if(pv===path)pv=''; /* 새로고침은 사이트 안 이동으로 세지 않음 */
      {% assign pa_iss = site.issues | where_exp: "i", "i.date <= site.time" | sort: "date" %}{% assign pa_latest = pa_iss | last %}var LATEST={{ pa_latest.url | default: "" | jsonify }};
      var c='기타';
      if(path==='/')c='홈';
      else if(path.indexOf('/weekly/')===0)c='윤리로 읽는 뉴스';
      else if(path.indexOf('/reading/')===0)c='윤리로 읽는 책';
      else if(path.indexOf('/ethics-lab/thinker/')===0)c='나와 닮은 사상가';
      else if(path.indexOf('/ethics-lab/timetable/')===0)c='내 삶의 시간표';
      else if(path.indexOf('/ethics-lab/')===0)c='윤리 실험실';
      else if(path.indexOf('/channel/')===0)c='윤리 채널';
      else if(path.indexOf('/about/')===0)c='소개·만든 책';
      else if(path.indexOf('/board/')===0)c='운영자에게 의견 보내기';
      else if(path.indexOf('/saved/')===0)c='찜한 글';
      var t=document.title.replace(/\s*·\s*[^·]+$/,'')||document.title;
      var u=api+'?act=hit&id='+encodeURIComponent(path)+'&t='+encodeURIComponent(t.trim().slice(0,120))+'&v='+v+'&f='+f+'&r='+encodeURIComponent(r)
        +'&cn='+encodeURIComponent(c)+'&fr='+encodeURIComponent(fr)+'&app='+app+'&pv='+encodeURIComponent(pv.slice(0,100));
      fetch(u,{mode:'no-cors',keepalive:true}).catch(function(){});
    }catch(e){}
  })();
  var groups={};
  document.querySelectorAll('.js-like').forEach(function(b){
    var id=b.getAttribute('data-id')||location.pathname;
    (groups[id]=groups[id]||{btns:[],n:null,liked:false}).btns.push(b);
  });
  Object.keys(groups).forEach(function(id){
    var g=groups[id], key='liked:'+id;
    try{g.liked=localStorage.getItem(key)==='1';}catch(e){}
    function paint(){g.btns.forEach(function(b){
      b.setAttribute('aria-pressed',g.liked?'true':'false'); b.classList.toggle('on',g.liked);
      b.querySelector('.like-ico').textContent=g.liked?'♥':'♡';
      b.querySelector('.like-n').textContent=g.n===null?'':g.n;});}
    function call(act){return fetch(api+'?act='+act+'&id='+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(d){if(d&&d.ok){g.n=d.count;paint();}}).catch(function(){});}
    paint(); call('get');
    g.btns.forEach(function(b){b.addEventListener('click',function(){
      if(b.disabled) return; g.liked=!g.liked; if(g.n!==null) g.n=Math.max(0,g.n+(g.liked?1:-1)); paint();
      try{g.liked?localStorage.setItem(key,'1'):localStorage.removeItem(key);}catch(e){}
      g.btns.forEach(function(x){x.disabled=true;});
      call(g.liked?'like':'unlike').then(function(){g.btns.forEach(function(x){x.disabled=false;});});
    });});
  });
})();
document.querySelectorAll('.js-url').forEach(function(el){el.textContent=location.href;});
</script>
