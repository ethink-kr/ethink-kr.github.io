<header class="masthead">
  <div class="wrap masthead-row">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-title">{{ site.title }}</span><span class="brand-sub">{{ site.tagline }}</span></a>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}">{{ site.news_title }}</a>
      <a href="{{ '/reading/' | relative_url }}">윤리로 읽는 책</a>
      <a href="{{ '/ethics-lab/' | relative_url }}">윤리 실험실</a>
      <a href="{{ '/channel/' | relative_url }}">윤리 채널</a>
      <a href="{{ '/about/' | relative_url }}">소개</a>
      {% if site.instagram %}<a class="nav-ig" href="{{ site.instagram }}?from=ethink-site" target="_blank" rel="noopener" aria-label="에씽크 인스타그램 (@ethink.kr)" title="에씽크 인스타그램 @ethink.kr"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg></a>{% endif %}
      <a href="{{ '/saved/' | relative_url }}">찜한 글<span class="nav-count js-saved-count"></span></a>
    </nav>
  </div>
</header>
