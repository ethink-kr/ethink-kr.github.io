{%- comment -%}인용문 출처(figcaption)가 인물 이름으로 시작하면 그 앞에 작은 초상(또는 머리글자 원)을 붙입니다. 목록은 _data/faces.yml.{%- endcomment -%}
{%- assign h = include.html -%}
{%- for f in site.data.faces -%}{%- for m in f.match -%}
{%- capture from -%}<figcaption><span class="who">{{ m }}</span>{%- endcapture -%}
{%- if f.img -%}
{%- capture to -%}<figcaption><span class="who"><img class="face" src="{{ f.img | relative_url }}" alt="" width="28" height="28" loading="lazy" title="{{ f.name }} · 이미지: {{ f.credit }} ({{ f.license }})">{{ m }}</span>{%- endcapture -%}
{%- else -%}
{%- capture to -%}<figcaption><span class="who"><span class="face face-initial" aria-hidden="true" title="{{ f.name }}">{{ f.initial }}</span>{{ m }}</span>{%- endcapture -%}
{%- endif -%}
{%- assign h = h | replace: from, to -%}
{%- endfor -%}{%- endfor -%}
{{- h -}}
{%- comment -%}퍼블릭 도메인이 아닌 사진(license_url이 있는 항목)을 쓴 글은 맨 아래에 아주 작게 출처를 밝힙니다.{%- endcomment -%}
{%- capture ic -%}{%- for f in site.data.faces -%}{%- if f.license_url and f.img -%}{%- capture key -%}title="{{ f.name }} ·{%- endcapture -%}{%- if h contains key -%}<span>{{ f.name }}: <a href="{{ f.url }}" target="_blank" rel="noopener">{{ f.credit }}</a>, <a href="{{ f.license_url }}" target="_blank" rel="noopener">{{ f.license }}</a></span> {% endif -%}{%- endif -%}{%- endfor -%}{%- endcapture -%}
{%- assign ic = ic | strip -%}
{%- if ic != "" -%}<p class="img-credit">사진 출처 · {{ ic }}</p>{%- endif -%}
