caption: '재미도 없는데, 왜 계속 볼까요?


  그만 보려 했는데 손가락은 또 화면을 넘깁니다. 멈추지 못한 나를 탓하기 전에, 나를 붙잡는 화면도 함께 살펴보면 어떨까요?


  애덤 알터의 『멈추지 못하는 사람들』은 개인의 의지와 함께, 계속 이용하게 만드는 환경과 제품의 설계에 주목합니다. ‘좋아하는 마음’과 ‘계속 원하는 마음’이 어긋나는 순간도 이야기합니다.


  에피쿠로스의 관점으로 즐거움 뒤의 삶을 헤아리고, 석가모니의 가르침으로 마음이 어디에 매달리는지 돌아봅니다. 그리고 한 걸음 더 묻습니다. 내가 멈추는 습관과, 서비스가 마련할 멈춤의 틈은 어떻게 함께 만들 수 있을까요?


  멈출 수 있는 화면을 위해, 무엇부터 바꾸면 좋을까요?

  A. 스스로 멈추는 습관

  B. 서비스의 자동 재생·추천 설계

  C. 사회가 정하는 이용자 보호 기준

  D. 여러 방법을 함께


  A~D 중 하나를 골라, 이유를 댓글 달아 주세요.


  📚 함께 읽은 책

  애덤 알터 지음, 홍지수 옮김, 『멈추지 못하는 사람들: 무엇이 당신을 끊임없이 확인하고 검색하게 만드는가』, 부키, 2019. 원제 Irresistible(2017).


  원문: 박재형, 「멈추지 못하는 것은 의지가 약해서일까?」, 에씽크 ‘윤리로 읽는 책’, 2026. 11. 12.

  철학 설명은 에피쿠로스 「메노이케우스에게 보내는 편지」, 『숫타니파타』 4.1을 뜻에 맞게 풀어 썼습니다. 오늘의 디지털 사례와 책임 분담 질문은 원문의 해석과 제안입니다.


