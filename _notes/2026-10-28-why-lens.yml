# 편집자 노트 №1 — 시안. 재형 님이 문장을 고친 뒤 승인(approved: true)하면 올린다. 사이트에는 올리지 않는 인스타그램 전용 게시물.
approved: false
no: №1
caption: |
  뉴스는 재료이고, 렌즈는 철학입니다.

  에씽크는 윤리 교과서와 교과 단행본을 만드는 편집자가 운영합니다. 뉴스 한 편, 책 한 권을 철학과 윤리학의 눈으로 다시 읽고, 글마다 생각해 볼 질문 하나를 담습니다.

  앞으로 화·목·토에는 시사 윤리를, 책을 읽으면 '윤리로 읽는 책'을, 가끔은 이렇게 편집자 노트를 올립니다.

  요즘 철학자의 눈으로 다시 읽어 보고 싶은 뉴스가 있으면 댓글로 알려 주세요.

  #철학 #인문학 #윤리 #편집자노트 #에씽크
cards:
  - type: cover
    kicker: 에씽크가 읽는 법
    hook: 뉴스는 재료이고, 렌즈는 철학입니다
    sub: 왜 에씽크는 뉴스를 철학자의 눈으로 다시 읽을까요?
    by: 에씽크 편집자
  - type: notes
    label: 에씽크는
    lines:
      - 윤리 교과서와 교과 단행본을 만드는 **편집자**가 운영합니다.
      - 뉴스 한 편, 책 한 권을 **철학과 윤리학의 눈**으로 다시 읽습니다.
      - 글마다 생각해 볼 **질문 하나**를 담습니다. 수업 자료로 써도, 혼자 읽어도 좋습니다.
  - type: notes
    label: 뉴스와 책은 재료입니다
    lines:
      - 시사 소재는 오늘의 현실과 철학을 잇는 **재료**입니다.
      - 글의 중심은 그 뉴스를 바라보는 **렌즈**, 곧 철학자의 이론과 원문, 이야기입니다.
      - 그래서 사건은 짧게 적고, 철학자의 문장은 **번역서와 교과서에서 원문 그대로** 옮깁니다.
  - type: notes
    label: 세 가지를 올립니다
    lines:
      - "**시사 윤리** — 화·목·토 아침. 녹색 카드입니다."
      - "**윤리로 읽는 책** — 책을 읽고 밑줄 그은 문장으로. 종이색 카드입니다."
      - "**편집자 노트** — 가끔, 만드는 사람의 이야기. 지금 보시는 베이지색 카드입니다."
  - type: end
    question: 요즘 철학자의 눈으로 다시 읽어 보고 싶은 뉴스가 있나요?
    ask: 댓글로 알려 주세요. 다음 글의 소재가 될 수 있습니다.
    cta: "에씽크의 글은\n프로필 링크 · ethink.kr에서 읽을 수 있습니다."
