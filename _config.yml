description: 뉴스와 책, 사상가의 문장을 윤리의 눈으로 다시 읽습니다. 도덕·윤리 선생님에게는 수업 자료로, 인문교양 독자에게는 생각할 거리로 건넵니다. 길벗 윤리 교과서·청소년 인문교양서 편집자 박재형이 운영합니다.
