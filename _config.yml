home_lead: 뉴스 한 편, 책 한 권을 윤리의 눈으로 다시 읽습니다. 글마다 생각해 볼 질문 하나를 담았습니다. 수업 자료로 써도, 혼자 읽어도 좋습니다.   # 홈 첫 화면 한 줄
home_when: 새 글은 화 · 목 · 토요일에 올라옵니다   # 홈 첫 화면 발행 안내
lang: ko
baseurl: ""            # 저장소 이름이 아이디.github.io가 아니면 "/저장소이름" 으로
url: "https://ethink.kr"

collections:
  issues:
    output: true
    permalink: /weekly/:name/
  items:
    output: true
    permalink: /weekly/:path/
  reads:                      # 「윤리로 읽는 책」 코너
    output: true
    permalink: /reading/:name/

defaults:
  - scope: { path: "", type: issues }
    values: { layout: issue }
  - scope: { path: "", type: items }
    values: { layout: item }
  - scope: { path: "", type: reads }
    values: { layout: read }

markdown: kramdown
plugins: [jekyll-sitemap]   # /sitemap.xml 자동 생성(검색 등록용)
exclude: [README.md, _templates, _tools, Gemfile, Gemfile.lock, "_items/**/ig*.txt", "_items/**/ig-cards*.yml", "_reads/ig"]
